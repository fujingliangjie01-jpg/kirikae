<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>切替確認</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{

  box-sizing:border-box;

}

body{

  margin:0;

  background:#0b0b0c;

  color:#fff;

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

}

.container{

  max-width:700px;

  margin:auto;

  padding:18px;

}

h1{

  text-align:center;

  margin:8px 0 22px;

  font-size:30px;

}

.target-box{

  background:#18181b;

  border:1px solid #333;

  border-radius:14px;

  padding:16px;

  margin-bottom:16px;

}

.target-label{

  color:#aaa;

  font-size:13px;

}

.target-value{

  margin-top:5px;

  font-size:28px;

  font-weight:800;

  letter-spacing:2px;

}

.camera-box{

  background:#18181b;

  border-radius:16px;

  padding:14px;

}

.video-wrap{

  position:relative;

}

video{

  width:100%;

  border-radius:12px;

  background:#000;

  display:none;

}

.scan-frame{

  position:absolute;

  left:8%;

  right:8%;

  top:35%;

  height:30%;

  border:3px solid #0a84ff;

  border-radius:12px;

  pointer-events:none;

  display:none;

}

button{

  width:100%;

  min-height:58px;

  border:none;

  border-radius:12px;

  margin-top:14px;

  font-size:18px;

  font-weight:800;

}

#cameraBtn{

  background:#0a84ff;

  color:#fff;

}

#stopBtn{

  background:#3a3a3c;

  color:#fff;

  display:none;

}

.card{

  background:#18181b;

  border-radius:14px;

  padding:16px;

  margin-top:16px;

}

.card-title{

  font-size:13px;

  color:#aaa;

  margin-bottom:8px;

}

#status{

  font-size:21px;

  font-weight:800;

}

#currentText{

  font-size:24px;

  font-weight:800;

  word-break:break-all;

}

#method{

  font-size:18px;

  font-weight:700;

}

.progress{

  margin-top:8px;

  color:#aaa;

}

.confirmed{

  border:2px solid #30d158;

}

#confirmedText{

  font-size:30px;

  font-weight:900;

  color:#30d158;

  letter-spacing:2px;

}

#confirmedMethod{

  margin-top:6px;

  color:#aaa;

}

canvas{

  display:none;

}

</style>

</head>

<body>

<div class="container">

  <h1>切替確認</h1>

  <div class="target-box">

    <div class="target-label">今回の確認対象</div>

    <div class="target-value">T629C</div>

  </div>

  <div class="camera-box">

    <div class="video-wrap">

      <video

        id="camera"

        autoplay

        playsinline

        muted>

      </video>

      <div

        id="scanFrame"

        class="scan-frame">

      </div>

    </div>

    <button id="cameraBtn">

      📷 カメラ起動

    </button>

    <button id="stopBtn">

      カメラ停止

    </button>

  </div>

  <div class="card">

    <div class="card-title">

      状態

    </div>

    <div id="status">

      待機中

    </div>

    <div

      id="progress"

      class="progress">

      確認 0 / 2

    </div>

  </div>

  <div class="card">

    <div class="card-title">

      現在の読取結果

    </div>

    <div id="currentText">

      未読取

    </div>

  </div>

  <div class="card">

    <div class="card-title">

      読み取り方法

    </div>

    <div id="method">

      -

    </div>

  </div>

  <div class="card confirmed">

    <div class="card-title">

      確定データ

    </div>

    <div id="confirmedText">

      未確定

    </div>

    <div id="confirmedMethod">

    </div>

  </div>

  <canvas id="canvas"></canvas>

</div>

<script>

const TARGET = "T629C";

const video =

document.getElementById("camera");

const canvas =

document.getElementById("canvas");

const cameraBtn =

document.getElementById("cameraBtn");

const stopBtn =

document.getElementById("stopBtn");

const scanFrame =

document.getElementById("scanFrame");

const statusEl =

document.getElementById("status");

const progressEl =

document.getElementById("progress");

const currentTextEl =

document.getElementById("currentText");

const methodEl =

document.getElementById("method");

const confirmedTextEl =

document.getElementById("confirmedText");

const confirmedMethodEl =

document.getElementById("confirmedMethod");

let stream = null;

let scanning = false;

let previousValue = "";

let previousMethod = "";

let sameCount = 0;

let confirmedData = null;

let barcodeDetector = null;

/* =========================

   BarcodeDetector準備

========================= */

if("BarcodeDetector" in window){

  BarcodeDetector

    .getSupportedFormats()

    .then(formats=>{

      barcodeDetector =

        new BarcodeDetector({

          formats:formats

        });

    })

    .catch(()=>{

      barcodeDetector = null;

    });

}

/* =========================

   カメラ起動

========================= */

cameraBtn.addEventListener(

"click",

async()=>{

  try{

    stream =

      await navigator.mediaDevices

      .getUserMedia({

        video:{

          facingMode:{

            ideal:"environment"

          },

          width:{

            ideal:1920

          },

          height:{

            ideal:1080

          }

        },

        audio:false

      });

    video.srcObject = stream;

    await video.play();

    video.style.display =

      "block";

    scanFrame.style.display =

      "block";

    cameraBtn.style.display =

      "none";

    stopBtn.style.display =

      "block";

    statusEl.textContent =

      "カメラ起動中";

    currentTextEl.textContent =

      "読み取り待ち";

    methodEl.textContent =

      "-";

    scanning = true;

    sameCount = 0;

    previousValue = "";

    previousMethod = "";

    progressEl.textContent =

      "確認 0 / 2";

    setTimeout(

      scanLoop,

      600

    );

  }

  catch(error){

    console.error(error);

    statusEl.textContent =

      "カメラを起動できません";

  }

});

/* =========================

   カメラ停止

========================= */

stopBtn.addEventListener(

"click",

()=>{

  stopCamera();

});

function stopCamera(){

  scanning = false;

  if(stream){

    stream

      .getTracks()

      .forEach(track=>{

        track.stop();

      });

    stream = null;

  }

  video.srcObject = null;

  video.style.display =

    "none";

  scanFrame.style.display =

    "none";

  cameraBtn.style.display =

    "block";

  stopBtn.style.display =

    "none";

  statusEl.textContent =

    "停止中";

}

/* =========================

   メイン読取ループ

========================= */

async function scanLoop(){

  if(!scanning){

    return;

  }

  if(video.readyState < 2){

    setTimeout(

      scanLoop,

      400

    );

    return;

  }

  statusEl.textContent =

    "🔍 読み取り中…";

  let detected = false;

  /*

  まずバーコードを優先

  */

  if(barcodeDetector){

    try{

      const barcodes =

        await barcodeDetector

        .detect(video);

      if(barcodes.length){

        for(

          const barcode

          of barcodes

        ){

          const value =

            normalizeText(

              barcode.rawValue

            );

          if(value){

            handleDetected(

              value,

              "バーコード"

            );

            detected = true;

            break;

          }

        }

      }

    }

    catch(error){

      console.log(

        "Barcode error",

        error

      );

    }

  }

  /*

  バーコード未検出ならOCR

  */

  if(!detected){

    await runOCR();

  }

  if(scanning){

    setTimeout(

      scanLoop,

      900

    );

  }

}

/* =========================

   OCR

========================= */

async function runOCR(){

  const width =

    video.videoWidth;

  const height =

    video.videoHeight;

  if(!width || !height){

    return;

  }

  /*

  画面中央だけOCRする

  */

  const cropX =

    width * 0.08;

  const cropY =

    height * 0.35;

  const cropW =

    width * 0.84;

  const cropH =

    height * 0.30;

  canvas.width =

    cropW;

  canvas.height =

    cropH;

  const ctx =

    canvas.getContext(

      "2d",

      {

        willReadFrequently:true

      }

    );

  ctx.drawImage(

    video,

    cropX,

    cropY,

    cropW,

    cropH,

    0,

    0,

    cropW,

    cropH

  );

  try{

    const result =

      await Tesseract.recognize(

        canvas,

        "eng"

      );

    const raw =

      result.data.text || "";

    const normalized =

      normalizeText(raw);

    /*

    OCR結果にT629Cが

    含まれているか確認

    */

    if(

      normalized.includes(

        TARGET

      )

    ){

      handleDetected(

        TARGET,

        "文字OCR"

      );

      return;

    }

    /*

    T629C以外でも

    読めた文字は表示する

    */

    if(normalized){

      currentTextEl.textContent =

        normalized;

      methodEl.textContent =

        "文字OCR";

      statusEl.textContent =

        "文字を検出";

    }

  }

  catch(error){

    console.error(

      "OCR error",

      error

    );

  }

}

/* =========================

   文字整形

========================= */

function normalizeText(text){

  return String(text)

    .toUpperCase()

    .replace(

      /\s+/g,

      ""

    )

    .replace(

      /[^A-Z0-9\-]/g,

      ""

    );

}

/* =========================

   検出処理

========================= */

function handleDetected(

  value,

  method

){

  currentTextEl.textContent =

    value;

  methodEl.textContent =

    method;

  if(

    value === previousValue &&

    method === previousMethod

  ){

    sameCount++;

  }

  else{

    previousValue =

      value;

    previousMethod =

      method;

    sameCount = 1;

  }

  progressEl.textContent =

    "確認 " +

    sameCount +

    " / 2";

  statusEl.textContent =

    "認識確認中";

  if(sameCount >= 2){

    confirmData(

      value,

      method

    );

  }

}

/* =========================

   確定

========================= */

function confirmData(

  value,

  method

){

  confirmedData = {

    value:value,

    method:method,

    time:

      new Date()

      .toLocaleString(

        "ja-JP"

      )

  };

  confirmedTextEl.textContent =

    confirmedData.value;

  confirmedMethodEl.textContent =

    confirmedData.method +

    " / " +

    confirmedData.time;

  statusEl.textContent =

    "✅ 読み取り完了";

  progressEl.textContent =

    "確認 2 / 2";

  scanning = false;

}

/* =========================

   保持データ取得用

========================= */

window.getConfirmedData =

function(){

  return confirmedData;

};

</script>

</body>

</html>
