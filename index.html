<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BOAT HUNTER V007</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07131d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,select,input{font:inherit}.hide{display:none!important}.wrap{max-width:900px;margin:auto;padding:14px}
.top{min-height:100vh;display:grid;place-items:center;text-align:center;background:linear-gradient(#06111b,#075176)}
.logo{font-size:56px;font-weight:1000;line-height:.9}.start{margin-top:26px;padding:15px 24px;border:0;border-radius:16px;font-weight:1000}
.head{display:flex;justify-content:space-between;align-items:center}.controls{display:grid;grid-template-columns:1.2fr 1fr .7fr;gap:8px;background:#0d1b27;padding:10px;border-radius:16px}
.controls>*{width:100%;padding:11px;border-radius:11px;border:1px solid #ffffff18;background:#08141e;color:#fff}.controls button{grid-column:1/-1;background:#48c7ff;color:#04131c;font-weight:1000}
.status{font-size:12px;color:#9bb0c1;margin:9px 2px}.cards{display:grid;gap:10px}.card{--c:#fff;--t:#111;background:#10212f;border-left:8px solid var(--c);border-radius:16px;padding:11px}
.b1{--c:#fff;--t:#111}.b2{--c:#111;--t:#fff}.b3{--c:#e51f2a;--t:#fff}.b4{--c:#176fd1;--t:#fff}.b5{--c:#f0db19;--t:#111}.b6{--c:#1fa34a;--t:#fff}
.row{display:flex;gap:9px;align-items:flex-start}.no{min-width:50px;height:50px;border-radius:13px;background:var(--c);color:var(--t);display:grid;place-items:center;font-size:29px;font-weight:1000}
.name{font-size:22px;font-weight:1000}.patch{display:inline-block;margin:2px 3px 0 0;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:1000}.rank{background:var(--c);color:var(--t)}
.ace{background:#d4af37;color:#a40000}.upper{background:#cfd4d8;color:#111}.normal{background:#f0da37;color:#111}.lower{background:#f09a32;color:#111}.broken{background:#d51d1d;color:#fff}
.big,.small{display:grid;gap:5px;margin-top:8px}.big{grid-template-columns:repeat(3,1fr)}.small{grid-template-columns:repeat(5,1fr);border-top:1px solid #ffffff18;padding-top:7px}
.stat{text-align:center;background:#08141e;border-radius:9px;padding:6px}.k{font-size:9px;color:#91a6b8}.v{font-size:15px;font-weight:1000}.small .v{font-size:11px}.na{color:#70879a}
.more{margin-top:8px;border:1px solid #ffffff22;background:#07131d;color:#b8d7e8;border-radius:10px;padding:7px 10px;font-size:11px}
.detail{margin-top:8px;padding:9px;background:#08141e;border-radius:12px}.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}.rate{background:#102433;border-radius:9px;padding:6px;text-align:center}.rate b{display:block;font-size:15px}
.hist{display:grid;gap:4px}.hrow{display:grid;grid-template-columns:75px 44px 44px 52px 1fr;gap:4px;font-size:10px;padding:5px;border-bottom:1px solid #ffffff12}.muted{color:#8da1b1}
.vol{position:fixed;right:8px;top:6px;font-size:9px;opacity:.35}
@media(max-width:620px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.big{grid-template-columns:1fr 1fr}.small{grid-template-columns:repeat(3,1fr)}.rates{grid-template-columns:1fr 1fr}.hrow{grid-template-columns:66px 38px 38px 48px 1fr}}

/* ===== V003 VISUAL RULES ===== */
:root{
 --rank1:#ff3b30; --rank2:#ffd60a; --top3:#173348;
}
.card{box-shadow:0 8px 22px rgba(0,0,0,.18)}
.name{letter-spacing:.01em}
.stat{border:1px solid rgba(255,255,255,.055)}
.v.rank1{color:#fff;background:var(--rank1);border-radius:7px;padding:2px 5px;display:inline-block;min-width:52px}
.v.rank2{color:#111;background:var(--rank2);border-radius:7px;padding:2px 5px;display:inline-block;min-width:52px}
.detail{border:1px solid rgba(255,255,255,.07)}
.histHead{display:grid;grid-template-columns:75px 44px 44px 52px 1fr;gap:4px;font-size:9px;color:#7890a3;padding:0 5px 5px}
.hrow{border-radius:7px;border-bottom:0!important}
.hrow.place1{background:linear-gradient(90deg,rgba(255,59,48,.38),rgba(255,59,48,.08));border-left:4px solid #ff3b30!important;font-weight:1000}
.hrow.place2{background:linear-gradient(90deg,rgba(255,214,10,.30),rgba(255,214,10,.06));border-left:4px solid #ffd60a!important;color:#fff}
.hrow.place3{background:linear-gradient(90deg,rgba(60,165,220,.20),rgba(60,165,220,.04));border-left:4px solid #43a8dc!important}
.placeBadge{font-weight:1000}
.place1 .placeBadge{color:#ff8a84}.place2 .placeBadge{color:#ffe36c}.place3 .placeBadge{color:#7bc9ef}
.summary3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.sum{padding:8px 5px;border-radius:10px;text-align:center;background:#0d2230;border:1px solid rgba(255,255,255,.06)}
.sum .sv{font-size:18px;font-weight:1000;margin-top:2px}
.sum.win .sv{color:#ff6b63}.sum.top2 .sv{color:#ffe05c}.sum.top3 .sv{color:#74caee}
.courseTitle{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:12px;font-weight:1000}
.courseChip{width:26px;height:26px;border-radius:8px;background:var(--c);color:var(--t);display:grid;place-items:center;font-weight:1000}
.rate{border:1px solid rgba(255,255,255,.055)}
@media(max-width:620px){.histHead{grid-template-columns:66px 38px 38px 48px 1fr}}


.stQuick{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.stBox{background:#0b1b27;border:1px solid rgba(255,255,255,.06);border-radius:9px;padding:6px;text-align:center}
.stBox .v{font-size:14px}
.stRank1{background:#ff3b30!important;color:#fff!important}
.stRank2{background:#ffd60a!important;color:#111!important}
.loadingPulse{animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.45}to{opacity:1}}
.progress{height:4px;background:#102a39;border-radius:99px;overflow:hidden;margin-top:6px}
.progress>i{display:block;height:100%;width:30%;background:#48c7ff;animation:loadbar 1.1s infinite ease-in-out}
@keyframes loadbar{0%{transform:translateX(-120%)}100%{transform:translateX(430%)}}

<body>
<section id="top" class="top top-normal">
  <div class="topVol">Vol.007</div>
  <div class="content">
    <div class="boat">🚤</div>
    <div class="badge" id="topBadge">BOAT HUNTER</div>
    <h1 class="logo">BOAT<br>HUNTER</h1>
    <div class="sub" id="topSub">人気ではなく期待値で勝つ</div>
    <button id="open" class="start">出走表を開く</button>
  </div>
  <div class="wave"></div>
</section>

<section id="main" class="hide">
<div class="wrap">
  <div class="head"><h2>出走表</h2><button id="back">トップへ</button></div>
  <div class="controls">
    <input id="date" type="date">
    <select id="stadium"></select>
    <select id="race"></select>
    <button id="get">出走表取得</button>
  </div>
  <div id="status" class="status">日付・場・Rを選択</div>
  <div id="cards" class="cards"></div>
</div>
</section>

<script>
const S={1:"桐生",2:"戸田",3:"江戸川",4:"平和島",5:"多摩川",6:"浜名湖",7:"蒲郡",8:"常滑",9:"津",10:"三国",11:"びわこ",12:"住之江",13:"尼崎",14:"鳴門",15:"丸亀",16:"児島",17:"宮島",18:"徳山",19:"下関",20:"若松",21:"芦屋",22:"福岡",23:"唐津",24:"大村"};
const R={1:"B2",2:"B1",3:"A2",4:"A1"};
const T={1:"逃げ",2:"差し",3:"まくり",4:"まくり差し",5:"抜き",6:"恵まれ"};
const $=x=>document.getElementById(x), n=x=>Number.isFinite(+x)?+x:null;
const f=(x,d=2)=>n(x)==null?"—":n(x).toFixed(d), p=x=>n(x)==null?"—":n(x).toFixed(1)+"%";
let currentRace=null, historyCache=null, historyLoading=null;

function motor(a,b){
 a=n(a);b=n(b);
 if(a<=15&&b<=24.9)return["扇風機（壊）","broken"];
 if(a>=55&&b>=65)return["エースモーター","ace"];
 if(a>=42&&b>=50)return["上位モーター","upper"];
 if(a<=24.9&&b<=34.9)return["下位モーター","lower"];
 return b>=35?["普通モーター","normal"]:["下位モーター","lower"];
}
function today(){return new Date(Date.now()+32400000).toISOString().slice(0,10)}
function url(d){let s=d.replaceAll("-","");return`https://boatraceopenapi.github.io/api/v1/${s.slice(0,4)}/${s}.json`}
function raceOf(j,jo,r){return j?.programs?.stadiums?.[String(jo)]?.races?.[String(r)]||null}
function racers(r){return Object.values(r?.racers||{}).sort((a,b)=>a.entry_number-b.entry_number)}
function grade(r){return R[+r.rank_number]||"—"}

function card(r){
 const b=+r.entry_number,[ml,mc]=motor(r.motor_top_2_percent,r.motor_top_3_percent);
 return `<article class="card b${b}" data-boat="${b}" data-number="${r.number}">
 <div class="row"><div class="no">${b}</div><div style="flex:1">
   <div class="name">${r.name||"—"}</div>
   <span class="patch rank">${grade(r)}</span><span class="patch ${mc}">${ml}</span>
   <div class="big">
    <div class="stat"><div class="k">全国勝率</div><div class="v">${f(r.national_win_rate)}</div></div>
    <div class="stat"><div class="k">今季の勝ち点</div><div id="seasonPts${b}" class="v na">取得中</div></div>
    <div class="stat"><div class="k">過去最高階級 / 年</div><div id="bestClass${b}" class="v na">取得中</div></div>
   </div>
   <div class="stQuick">
    <div class="stBox"><div class="k">今コース 平均ST</div><div id="avgst${b}" class="v na">取得中</div></div>
    <div class="stBox"><div class="k">今コース ST順位</div><div id="avgrank${b}" class="v na">取得中</div></div>
   </div>
 </div></div>
 <div class="small">
  <div class="stat"><div class="k">モーター</div><div class="v">${r.motor_number??"—"}号機</div></div>
  <div class="stat"><div class="k">2連対率</div><div class="v">${p(r.motor_top_2_percent)}</div></div>
  <div class="stat"><div class="k">3連対率</div><div class="v">${p(r.motor_top_3_percent)}</div></div>
  <div class="stat"><div class="k">今節得点率</div><div id="meetPts${b}" class="v na">取得中</div></div>
  <div class="stat"><div class="k">得点順位</div><div id="meetRank${b}" class="v na">取得中</div></div>
 </div>
 <button class="more" onclick="toggleDetail(${b},${r.number})">同コース過去20走 ▼</button>
 <div id="d${b}" class="detail hide"></div>
 </article>`;
}
function decorateRanks(rr){
 const metrics=[
  ["national_win_rate",0],
  ["motor_top_2_percent",1],
  ["motor_top_3_percent",2]
 ];
 metrics.forEach(([key,slot])=>{
  const sorted=rr.map((r,i)=>({i,v:n(r[key])})).filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);
  sorted.slice(0,2).forEach((x,rank)=>{
   const cardEl=$("cards").children[x.i];
   const vals=cardEl.querySelectorAll(".v");
   const target=slot===0?vals[0]:vals[slot===1?4:5];
   if(target)target.classList.add(rank===0?"rank1":"rank2");
  });
 });
}

async function getRace(){
 $("status").textContent="取得中…";$("cards").innerHTML="";historyCache=null;historyLoading=null;
 try{
  let j=await fetch(url($("date").value),{cache:"no-store"}).then(x=>{if(!x.ok)throw Error(x.status);return x.json()});
  currentRace=raceOf(j,$("stadium").value,$("race").value);
  setTopTheme(raceTheme(currentRace));
  let rr=racers(currentRace);if(rr.length!==6)throw Error("6艇を取得できません");
  $("cards").innerHTML=rr.map(card).join("");
  decorateRanks(rr);
  $("status").textContent=`✓ ${S[$("stadium").value]} ${$("race").value}R / 過去20走を高速取得中…`;
  preloadHistory(rr);
  loadMeetPoints(rr);
  loadBestClasses(rr);
 }catch(e){$("status").textContent="取得失敗："+e.message}
}

function allRaces(j){
 let out=[];for(const st of Object.values(j?.programs?.stadiums||{}))for(const r of Object.values(st?.races||{}))if(r.result?.racers)out.push(r);return out
}
function dateMinus(s,days){
 const [y,m,d]=s.split("-").map(Number);
 const x=new Date(Date.UTC(y,m-1,d-days));
 return x.toISOString().slice(0,10)
}
function dayJson(date){
 return fetch(url(date),{cache:"force-cache"})
   .then(x=>x.ok?x.json():null)
   .catch(()=>null)
}
function stRanks(rs){
 const vals=rs.map(x=>n(x.start_timing)).filter(x=>x!=null).sort((a,b)=>a-b);
 const map=new Map();
 for(const x of rs){
  const v=n(x.start_timing);
  if(v==null)continue;
  map.set(+x.entry_number,vals.indexOf(v)+1);
 }
 return map
}
function consumeHistoryDay(j,d,targets){
 if(!j)return;
 for(const race of allRaces(j)){
  const rs=Object.values(race.result?.racers||{});
  const winner=rs.find(x=>+x.place_number===1);
  if(!winner)continue;
  const ranks=stRanks(rs);
  for(const self of rs){
   const obj=targets.get(+self.number);
   if(!obj)continue;
   if(d>=window.__seasonStart){
    const pt={1:10,2:8,3:6,4:4,5:2,6:1}[+self.place_number];
    if(pt){obj.seasonPts+=pt;obj.seasonStarts++}
   }
   if(obj.rows.length>=20)continue;
   if(+self.course_number!==obj.course)continue;
   obj.rows.push({
    date:d,place:+self.place_number,entry:+self.entry_number,course:+self.course_number,
    st:n(self.start_timing),stRank:ranks.get(+self.entry_number)||null,
    winnerEntry:+winner.entry_number,winnerCourse:+winner.course_number,
    tech:+race.result.technique_number,stadium:+race.stadium_number,race:+race.race_number
   });
  }
 }
}
async function buildHistory(){
 const rr=racers(currentRace);
 const targets=new Map(rr.map(x=>[+x.number,{course:+x.entry_number,rows:[],seasonPts:0,seasonStarts:0}]));
 const start=$("date").value;
 const yy=+start.slice(0,4), mm=+start.slice(5,7);
 const seasonStart=`${yy}-${mm>=7?"07":"01"}-01`;
 const BATCH=14,MAX_DAYS=420;
 window.__seasonStart=seasonStart;

 for(let from=1;from<=MAX_DAYS;from+=BATCH){
  const oldest=dateMinus(start,from);
  if([...targets.values()].every(o=>o.rows.length>=20) && oldest<=seasonStart)break;
  const dates=Array.from({length:BATCH},(_,i)=>dateMinus(start,from+i));
  const jsons=await Promise.all(dates.map(dayJson));
  // 新しい日付→古い日付の順を維持
  for(let i=0;i<dates.length;i++)consumeHistoryDay(jsons[i],dates[i],targets);
  $("status").innerHTML=`選手データ取得中… ${Math.min(from+BATCH-1,MAX_DAYS)}日分確認<div class="progress"><i></i></div>`;
 }
 for(const o of targets.values())o.rows=o.rows.slice(0,20);
 return new Map([...targets].map(([k,v])=>[k,v]));
}
function histMetrics(h){
 if(!h.length)return{avgST:null,avgRank:null,win:0,top2:0,top3:0};
 const sts=h.map(x=>n(x.st)).filter(x=>x!=null);
 const rs=h.map(x=>n(x.stRank)).filter(x=>x!=null);
 return{
  avgST:sts.length?sts.reduce((a,b)=>a+b,0)/sts.length:null,
  avgRank:rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null,
  win:h.filter(x=>x.place===1).length,
  top2:h.filter(x=>x.place<=2).length,
  top3:h.filter(x=>x.place<=3).length
 }
}
function updateMainHistory(rr,map){
 rr.forEach(r=>{
  const b=+r.entry_number,obj=map.get(+r.number),h=obj?.rows||[],m=histMetrics(h);
  const a=$("avgst"+b),q=$("avgrank"+b);
  if(a){a.classList.remove("na");a.textContent=m.avgST==null?"—":m.avgST.toFixed(3)}
  if(q){q.classList.remove("na");q.textContent=m.avgRank==null?"—":m.avgRank.toFixed(2)+"位"}
  const sp=$("seasonPts"+b);
  if(sp){sp.classList.remove("na");sp.classList.add("dataLive");sp.textContent=obj?`${obj.seasonPts}点 / ${obj.seasonStarts}走`:"—"}
 });
 // 6艇中の平均ST順位を色分け：1位赤、2位黄
 const vals=rr.map(r=>({b:+r.entry_number,h:map.get(+r.number)?.rows||[]}))
   .map(x=>({b:x.b,v:histMetrics(x.h).avgST}))
   .filter(x=>x.v!=null).sort((a,b)=>a.v-b.v);
 vals.slice(0,2).forEach((x,i)=>{
  const el=$("avgst"+x.b);if(el)el.classList.add(i===0?"stRank1":"stRank2")
 });
}


async function legacyDay(date){
 const ymd=date.replaceAll("-","");
 const y=ymd.slice(0,4);
 const endpoint=date>="2026-01-01"
  ?`https://boatraceopenapi.github.io/api/v1/${y}/${ymd}.json`
  :`https://boatraceopenapi.github.io/programs/v3/${y}/${ymd}.json`;
 try{const r=await fetch(endpoint,{cache:"force-cache"});return r.ok?await r.json():null}catch(e){return null}
}
function scanProgramRacers(j,cb){
 const sts=j?.programs?.stadiums||j?.stadiums||{};
 for(const st of Object.values(sts)){
  const races=st?.races||{};
  for(const race of Object.values(races)){
   const rs=race?.racers||{};
   for(const r of Object.values(rs))cb(r)
  }
 }
}
async function loadBestClasses(rr){
 const target=new Map(rr.map(r=>[+r.number,{best:+r.rank_number||0,year:+$("date").value.slice(0,4)}]));
 const starts=["2023-07-01","2024-01-01","2024-07-01","2025-01-01","2025-07-01","2026-01-01","2026-07-01"];
 // 3-day intervals over first 24 days of each class term: 56 shared files, not per racer.
 const dates=[];
 for(const st of starts)for(let d=0;d<24;d+=3)dates.push(dateMinus(st,-d));
 for(let i=0;i<dates.length;i+=8){
  const chunk=dates.slice(i,i+8),js=await Promise.all(chunk.map(legacyDay));
  js.forEach((j,k)=>{
   if(!j)return;
   const yr=+chunk[k].slice(0,4);
   scanProgramRacers(j,r=>{
    const o=target.get(+r.number);if(!o)return;
    const rank=+r.rank_number||0;
    if(rank>o.best){o.best=rank;o.year=yr}
    else if(rank===o.best&&yr<o.year)o.year=yr;
   })
  })
 }
 target.forEach((o,num)=>{
  const r=rr.find(x=>+x.number===num);if(!r)return;
  const el=$("bestClass"+r.entry_number);
  if(el){el.classList.remove("na");el.classList.add("dataLive");el.textContent=`${R[o.best]||"—"} / ${o.year}年`}
 });
}

async function fetchTextCors(target){
 const urls=[
  "https://api.allorigins.win/raw?url="+encodeURIComponent(target),
  "https://corsproxy.io/?url="+encodeURIComponent(target)
 ];
 for(const u of urls){
  try{const r=await fetch(u,{cache:"no-store"});if(r.ok){const t=await r.text();if(t.length>500)return t}}catch(e){}
 }
 throw Error("official fetch failed")
}
async function loadMeetPoints(rr){
 const d=$("date").value.replaceAll("-",""),j=String($("stadium").value).padStart(2,"0"),rno=$("race").value;
 const target=`https://www.boatrace.jp/owpc/pc/race/pointchart?hd=${d}&jcd=${j}&rno=${rno}`;
 try{
  const html=await fetchTextCors(target),doc=new DOMParser().parseFromString(html,"text/html");
  const rows=[...doc.querySelectorAll("tr")];
  rr.forEach(r=>{
   const tr=rows.find(x=>x.textContent.includes(String(r.number)));
   if(!tr)return;
   const txt=tr.textContent.replace(/\s+/g," ").trim();
   // Registered no / class / name are followed by score rate and rank.
   const after=txt.slice(txt.indexOf(String(r.number))+4);
   const nums=[...after.matchAll(/(?<!\d)(\d{1,2}\.\d{2}|\d{1,2})(?!\d)/g)].map(x=>x[1]);
   let rate=null,rank=null;
   for(let i=0;i<nums.length;i++){
    if(rate==null && nums[i].includes(".")){rate=nums[i]; if(nums[i+1]&&!nums[i+1].includes("."))rank=nums[i+1]; break}
   }
   const a=$("meetPts"+r.entry_number),b=$("meetRank"+r.entry_number);
   if(a&&rate){a.textContent=rate;a.classList.remove("na");a.classList.add("dataLive")}
   if(b&&rank){b.textContent=rank+"位";b.classList.remove("na");b.classList.add("dataLive")}
  });
 }catch(e){
  rr.forEach(r=>{
   const a=$("meetPts"+r.entry_number),b=$("meetRank"+r.entry_number);
   if(a)a.textContent="公式取得待ち";
   if(b)b.textContent="公式取得待ち";
  });
 }
}

async function preloadHistory(rr){
 try{
  if(!historyLoading)historyLoading=buildHistory();
  historyCache=await historyLoading;
  updateMainHistory(rr,historyCache);
  $("status").textContent="✓ 出走表＋同コース過去20走 取得完了";
 }catch(e){
  $("status").textContent="出走表取得済み / 過去20走の取得に失敗";
 }
}

function rateStats(h,course){
 const base=h.length||1,c=k=>`${k}/${h.length} (${(k/base*100).toFixed(1)}%)`;
 let s=[];
 if(course===1){
  s=[["逃げ率",h.filter(x=>x.place===1&&x.tech===1).length],
     ["差され率",h.filter(x=>x.place!==1&&x.tech===2).length],
     ["まくられ率",h.filter(x=>x.place!==1&&x.tech===3).length],
     ["まくり差され率",h.filter(x=>x.place!==1&&x.tech===4).length]];
 }else if(course===2){
  s=[["差し率",h.filter(x=>x.place===1&&x.tech===2).length],
     ["まくり率",h.filter(x=>x.place===1&&x.tech===3).length],
     ["3コースのまくられ率",h.filter(x=>x.place!==1&&x.winnerCourse===3&&x.tech===3).length],
     ["アウトまくられ率",h.filter(x=>x.place!==1&&x.winnerCourse>=4&&x.tech===3).length]];
 }else if(course===3){
  s=[["差し率",h.filter(x=>x.place===1&&x.tech===2).length],
     ["まくり率",h.filter(x=>x.place===1&&x.tech===3).length],
     ["まくり差し率",h.filter(x=>x.place===1&&x.tech===4).length],
     ["アウトまくられ率",h.filter(x=>x.place!==1&&x.winnerCourse>=4&&x.tech===3).length]];
 }else{
  s=[["差し率",h.filter(x=>x.place===1&&x.tech===2).length],
     ["まくり率",h.filter(x=>x.place===1&&x.tech===3).length],
     ["まくり差し率",h.filter(x=>x.place===1&&x.tech===4).length]];
 }
 return s.map(x=>`<div class="rate"><span class="k">${x[0]}</span><b>${c(x[1])}</b></div>`).join("");
}
function recentSummary(h){
 const base=h.length||1,m=histMetrics(h),pc=k=>(k/base*100).toFixed(1)+"%";
 return `<div class="summary3">
   <div class="sum win"><div class="k">1着率</div><div class="sv">${pc(m.win)}</div></div>
   <div class="sum top2"><div class="k">2連対率</div><div class="sv">${pc(m.top2)}</div></div>
   <div class="sum top3"><div class="k">3連対率</div><div class="sv">${pc(m.top3)}</div></div>
   <div class="sum"><div class="k">平均ST</div><div class="sv">${m.avgST==null?"—":m.avgST.toFixed(3)}</div></div>
   <div class="sum"><div class="k">平均ST順位</div><div class="sv">${m.avgRank==null?"—":m.avgRank.toFixed(2)+"位"}</div></div>
   <div class="sum"><div class="k">母数</div><div class="sv">${h.length}走</div></div>
 </div>`;
}
async function toggleDetail(boatNo,number){
 const box=$("d"+boatNo);
 if(!box.classList.contains("hide")){box.classList.add("hide");return}
 box.classList.remove("hide");
 if(box.dataset.done)return;
 box.innerHTML='<div class="muted">同じコースの過去20走を取得中…</div>';
 if(!historyCache){
  if(!historyLoading)historyLoading=buildHistory();
  historyCache=await historyLoading;
 }
 const obj=historyCache.get(+number),h=obj?.rows||[];
 let rows=h.map(x=>`<div class="hrow place${x.place<=3?x.place:0}">
   <span>${x.date.slice(5)}</span><span class="placeBadge">${x.place}着</span><span>${x.course}コース</span><span>ST ${f(x.st,2)} / ${x.stRank??"—"}位</span>
   <span>1着 ${x.winnerEntry}号艇 / ${T[x.tech]||"不明"}</span>
 </div>`).join("");
 box.innerHTML=`<div class="courseTitle"><span class="courseChip">${boatNo}</span>${boatNo}コース限定・直近${h.length}走</div>
 ${recentSummary(h)}
 <div class="rates">${rateStats(h,boatNo)}</div>
 <div class="hist">
   <div class="histHead"><span>日付</span><span>着</span><span>コース</span><span>ST / 順位</span><span>1着艇 / 決まり手</span></div>
   ${rows||'<div class="muted">履歴なし</div>'}
 </div>`;
 box.dataset.done="1";
}


function setTopTheme(type){
 const t=$("top");
 t.classList.remove("top-normal","top-sg","top-ladies");
 if(type==="sg"){
  t.classList.add("top-sg");
  $("topBadge").textContent="🏆 SG FESTIVAL • SPECIAL GRADE 🏆";
  $("topSub").textContent="SPECIAL GRADE • BOAT HUNTER FESTIVAL";
 }else if(type==="ladies"){
  t.classList.add("top-ladies");
  $("topBadge").textContent="🌸 ALL LADIES 開催中 💗";
  $("topSub").textContent="BOAT HUNTER • LADIES FESTIVAL";
 }else{
  t.classList.add("top-normal");
  $("topBadge").textContent="BOAT HUNTER";
  $("topSub").textContent="人気ではなく期待値で勝つ";
 }
}
function raceTheme(r){
 const text=((r?.title||"")+" "+(r?.subtitle||"")).toUpperCase();
 if(["SG","グランプリ","ボートレースクラシック","ボートレースオールスター","グランドチャンピオン","オーシャンカップ","ボートレースメモリアル","ボートレースダービー","チャレンジカップ"].some(x=>text.includes(x.toUpperCase())))return"sg";
 if(["オールレディース","ヴィーナス","レディースチャンピオン","クイーンズクライマックス","女子"].some(x=>text.includes(x.toUpperCase())))return"ladies";
 return"normal";
}

function applyVenueTheme(){
 const m=$("main");
 m.classList.toggle("kiryu",$("stadium").value==="1");
}

$("date").value=today();
$("stadium").innerHTML=Object.entries(S).map(([k,v])=>`<option value="${k}">${k}. ${v}</option>`).join("");
$("race").innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}R</option>`).join("");
$("open").onclick=()=>{$("top").classList.add("hide");$("main").classList.remove("hide");applyVenueTheme()};
$("back").onclick=()=>{$("main").classList.add("hide");$("top").classList.remove("hide")};
$("get").onclick=getRace;

setTopTheme('normal');
