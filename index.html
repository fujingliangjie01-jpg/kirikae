/* ===== V003 VISUAL RULES ===== */
:root{
 --rank1:#ff3b30; --rank2:#ffd60a; --top3:#173348;
}
.card{box-shadow:0 8px 22px rgba(0,0,0,.18)}
.name{letter-spacing:.01em}
.stat{border:1px solid rgba(255,255,255,.055)}
.v.rank1{color:#fff;background:var(--rank1);border-radius:7px;padding:2px 5px;display:inline-block;min-width:52px}
.v.rank2{color:#111;background:var(--rank2);border-radius:7px;padding:2px 5px;display:inline-block;min-width:52px}
.detail{border:1px solid rgba(255,255,255,.07)}
.histHead{display:grid;grid-template-columns:75px 44px 44px 52px 1fr;gap:4px;font-size:9px;color:#7890a3;padding:0 5px 5px}
.hrow{border-radius:7px;border-bottom:0!important}
.hrow.place1{background:linear-gradient(90deg,rgba(255,59,48,.38),rgba(255,59,48,.08));border-left:4px solid #ff3b30!important;font-weight:1000}
.hrow.place2{background:linear-gradient(90deg,rgba(255,214,10,.30),rgba(255,214,10,.06));border-left:4px solid #ffd60a!important;color:#fff}
.hrow.place3{background:linear-gradient(90deg,rgba(60,165,220,.20),rgba(60,165,220,.04));border-left:4px solid #43a8dc!important}
.placeBadge{font-weight:1000}
.place1 .placeBadge{color:#ff8a84}.place2 .placeBadge{color:#ffe36c}.place3 .placeBadge{color:#7bc9ef}
.summary3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.sum{padding:8px 5px;border-radius:10px;text-align:center;background:#0d2230;border:1px solid rgba(255,255,255,.06)}
.sum .sv{font-size:18px;font-weight:1000;margin-top:2px}
.sum.win .sv{color:#ff6b63}.sum.top2 .sv{color:#ffe05c}.sum.top3 .sv{color:#74caee}
.courseTitle{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:12px;font-weight:1000}
.courseChip{width:26px;height:26px;border-radius:8px;background:var(--c);color:var(--t);display:grid;place-items:center;font-weight:1000}
.rate{border:1px solid rgba(255,255,255,.055)}
@media(max-width:620px){.histHead{grid-template-columns:66px 38px 38px 48px 1fr}}


.stQuick{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.stBox{background:#0b1b27;border:1px solid rgba(255,255,255,.06);border-radius:9px;padding:6px;text-align:center}
.stBox .v{font-size:14px}
.stRank1{background:#ff3b30!important;color:#fff!important}
.stRank2{background:#ffd60a!important;color:#111!important}
.loadingPulse{animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.45}to{opacity:1}}
.progress{height:4px;background:#102a39;border-radius:99px;overflow:hidden;margin-top:6px}
.progress>i{display:block;height:100%;width:30%;background:#48c7ff;animation:loadbar 1.1s infinite ease-in-out}
@keyframes loadbar{0%{transform:translateX(-120%)}100%{transform:translateX(430%)}}

<script>
const S={1:"桐生",2:"戸田",3:"江戸川",4:"平和島",5:"多摩川",6:"浜名湖",7:"蒲郡",8:"常滑",9:"津",10:"三国",11:"びわこ",12:"住之江",13:"尼崎",14:"鳴門",15:"丸亀",16:"児島",17:"宮島",18:"徳山",19:"下関",20:"若松",21:"芦屋",22:"福岡",23:"唐津",24:"大村"};
const R={1:"B2",2:"B1",3:"A2",4:"A1"};
const T={1:"逃げ",2:"差し",3:"まくり",4:"まくり差し",5:"抜き",6:"恵まれ"};
const $=x=>document.getElementById(x), n=x=>Number.isFinite(+x)?+x:null;
const f=(x,d=2)=>n(x)==null?"—":n(x).toFixed(d), p=x=>n(x)==null?"—":n(x).toFixed(1)+"%";
let currentRace=null, historyCache=null, historyLoading=null;

function motor(a,b){
 a=n(a);b=n(b);
 if(a<=15&&b<=24.9)return["扇風機（壊）","broken"];
 if(a>=55&&b>=65)return["エースモーター","ace"];
 if(a>=42&&b>=50)return["上位モーター","upper"];
 if(a<=24.9&&b<=34.9)return["下位モーター","lower"];
 return b>=35?["普通モーター","normal"]:["下位モーター","lower"];
}
function today(){return new Date(Date.now()+32400000).toISOString().slice(0,10)}
function url(d){let s=d.replaceAll("-","");return`https://boatraceopenapi.github.io/api/v1/${s.slice(0,4)}/${s}.json`}
function raceOf(j,jo,r){return j?.programs?.stadiums?.[String(jo)]?.races?.[String(r)]||null}
function racers(r){return Object.values(r?.racers||{}).sort((a,b)=>a.entry_number-b.entry_number)}
function grade(r){return R[+r.rank_number]||"—"}

function card(r){
 const b=+r.entry_number,[ml,mc]=motor(r.motor_top_2_percent,r.motor_top_3_percent);
 return `<article class="card b${b}" data-boat="${b}" data-number="${r.number}">
 <div class="row"><div class="no">${b}</div><div style="flex:1">
   <div class="name">${r.name||"—"}</div>
   <span class="patch rank">${grade(r)}</span><span class="patch ${mc}">${ml}</span>
   <div class="big">
    <div class="stat"><div class="k">全国勝率</div><div class="v">${f(r.national_win_rate)}</div></div>
    <div class="stat"><div class="k">今季の勝ち点</div><div id="seasonPts${b}" class="v na">取得中</div></div>
    <div class="stat"><div class="k">過去最高階級 / 年</div><div id="bestClass${b}" class="v na">取得中</div></div>
   </div>
   <div class="stQuick">
    <div class="stBox"><div class="k">今コース 平均ST</div><div id="avgst${b}" class="v na">取得中</div></div>
    <div class="stBox"><div class="k">今コース ST順位</div><div id="avgrank${b}" class="v na">取得中</div></div>
   </div>
 </div></div>
 <div class="small">
  <div class="stat"><div class="k">モーター</div><div class="v">${r.motor_number??"—"}号機</div></div>
  <div class="stat"><div class="k">2連対率</div><div class="v">${p(r.motor_top_2_percent)}</div></div>
  <div class="stat"><div class="k">3連対率</div><div class="v">${p(r.motor_top_3_percent)}</div></div>
  <div class="stat"><div class="k">今節得点率</div><div id="meetPts${b}" class="v na">取得中</div></div>
  <div class="stat"><div class="k">得点順位</div><div id="meetRank${b}" class="v na">取得中</div></div>
 </div>
 <button class="more" onclick="toggleDetail(${b},${r.number})">同コース過去20走 ▼</button>
 <div id="d${b}" class="detail hide"></div>
 </article>`;
}
function decorateRanks(rr){
 const metrics=[
  ["national_win_rate",0],
  ["motor_top_2_percent",1],
  ["motor_top_3_percent",2]
 ];
 metrics.forEach(([key,slot])=>{
  const sorted=rr.map((r,i)=>({i,v:n(r[key])})).filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);
  sorted.slice(0,2).forEach((x,rank)=>{
   const cardEl=$("cards").children[x.i];
   const vals=cardEl.querySelectorAll(".v");
   const target=slot===0?vals[0]:vals[slot===1?4:5];
   if(target)target.classList.add(rank===0?"rank1":"rank2");
  });
 });
}

async function getRace(){
 window.resetHunterPreflight?.();
 $("status").textContent="取得中…";$("cards").innerHTML="";historyCache=null;historyLoading=null;
 try{
  let j=await fetch(url($("date").value),{cache:"no-store"}).then(x=>{if(!x.ok)throw Error(x.status);return x.json()});
  currentRace=raceOf(j,$("stadium").value,$("race").value);
  setTopTheme(raceTheme(currentRace));
  let rr=racers(currentRace);if(rr.length!==6)throw Error("6艇を取得できません");
  $("cards").innerHTML=rr.map(card).join("");
  decorateRanks(rr);
  if($("getPreview"))$("getPreview").disabled=false;
  if($("aiAnalyze"))$("aiAnalyze").disabled=false;
  $("status").textContent=`✓ ${S[$("stadium").value]} ${$("race").value}R / 過去20走を高速取得中…`;
  preloadHistory(rr);
  loadMeetPoints(rr);
  loadBestClasses(rr);
 }catch(e){$("status").textContent="取得失敗："+e.message}
}

function allRaces(j){
 let out=[];for(const st of Object.values(j?.programs?.stadiums||{}))for(const r of Object.values(st?.races||{}))if(r.result?.racers)out.push(r);return out
}
function dateMinus(s,days){
 const [y,m,d]=s.split("-").map(Number);
 const x=new Date(Date.UTC(y,m-1,d-days));
 return x.toISOString().slice(0,10)
}
function dayJson(date){
 return fetch(url(date),{cache:"force-cache"})
   .then(x=>x.ok?x.json():null)
   .catch(()=>null)
}
function stRanks(rs){
 const vals=rs.map(x=>n(x.start_timing)).filter(x=>x!=null).sort((a,b)=>a-b);
 const map=new Map();
 for(const x of rs){
  const v=n(x.start_timing);
  if(v==null)continue;
  map.set(+x.entry_number,vals.indexOf(v)+1);
 }
 return map
}
function consumeHistoryDay(j,d,targets){
 if(!j)return;
 for(const race of allRaces(j)){
  const rs=Object.values(race.result?.racers||{});
  const winner=rs.find(x=>+x.place_number===1);
  if(!winner)continue;
  const ranks=stRanks(rs);
  for(const self of rs){
   const obj=targets.get(+self.number);
   if(!obj)continue;
   if(d>=window.__seasonStart){
    const pt={1:10,2:8,3:6,4:4,5:2,6:1}[+self.place_number];
    if(pt){obj.seasonPts+=pt;obj.seasonStarts++}
   }
   if(obj.rows.length>=20)continue;
   if(+self.course_number!==obj.course)continue;
   obj.rows.push({
    date:d,place:+self.place_number,entry:+self.entry_number,course:+self.course_number,
    st:n(self.start_timing),stRank:ranks.get(+self.entry_number)||null,
    winnerEntry:+winner.entry_number,winnerCourse:+winner.course_number,
    tech:+race.result.technique_number,stadium:+race.stadium_number,race:+race.race_number
   });
  }
 }
}
async function buildHistory(){
 const rr=racers(currentRace);
 const targets=new Map(rr.map(x=>[+x.number,{course:+x.entry_number,rows:[],seasonPts:0,seasonStarts:0}]));
 const start=$("date").value;
 const yy=+start.slice(0,4), mm=+start.slice(5,7);
 const seasonStart=`${yy}-${mm>=7?"07":"01"}-01`;
 const BATCH=14,MAX_DAYS=420;
 window.__seasonStart=seasonStart;

 for(let from=1;from<=MAX_DAYS;from+=BATCH){
  const oldest=dateMinus(start,from);
  if([...targets.values()].every(o=>o.rows.length>=20) && oldest<=seasonStart)break;
  const dates=Array.from({length:BATCH},(_,i)=>dateMinus(start,from+i));
  const jsons=await Promise.all(dates.map(dayJson));
  // 新しい日付→古い日付の順を維持
  for(let i=0;i<dates.length;i++)consumeHistoryDay(jsons[i],dates[i],targets);
  $("status").innerHTML=`選手データ取得中… ${Math.min(from+BATCH-1,MAX_DAYS)}日分確認<div class="progress"><i></i></div>`;
 }
 for(const o of targets.values())o.rows=o.rows.slice(0,20);
 return new Map([...targets].map(([k,v])=>[k,v]));
}
function histMetrics(h){
 if(!h.length)return{avgST:null,avgRank:null,win:0,top2:0,top3:0};
 const sts=h.map(x=>n(x.st)).filter(x=>x!=null);
 const rs=h.map(x=>n(x.stRank)).filter(x=>x!=null);
 return{
  avgST:sts.length?sts.reduce((a,b)=>a+b,0)/sts.length:null,
  avgRank:rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null,
  win:h.filter(x=>x.place===1).length,
  top2:h.filter(x=>x.place<=2).length,
  top3:h.filter(x=>x.place<=3).length
 }
}
function updateMainHistory(rr,map){
 rr.forEach(r=>{
  const b=+r.entry_number,obj=map.get(+r.number),h=obj?.rows||[],m=histMetrics(h);
  const a=$("avgst"+b),q=$("avgrank"+b);
  if(a){a.classList.remove("na");a.textContent=m.avgST==null?"—":m.avgST.toFixed(3)}
  if(q){q.classList.remove("na");q.textContent=m.avgRank==null?"—":m.avgRank.toFixed(2)+"位"}
  const sp=$("seasonPts"+b);
  if(sp){sp.classList.remove("na");sp.classList.add("dataLive");sp.textContent=obj?`${obj.seasonPts}点 / ${obj.seasonStarts}走`:"—"}
 });
 // 6艇中の平均ST順位を色分け：1位赤、2位黄
 const vals=rr.map(r=>({b:+r.entry_number,h:map.get(+r.number)?.rows||[]}))
   .map(x=>({b:x.b,v:histMetrics(x.h).avgST}))
   .filter(x=>x.v!=null).sort((a,b)=>a.v-b.v);
 vals.slice(0,2).forEach((x,i)=>{
  const el=$("avgst"+x.b);if(el)el.classList.add(i===0?"stRank1":"stRank2")
 });
}


async function legacyDay(date){
 const ymd=date.replaceAll("-","");
 const y=ymd.slice(0,4);
 const endpoint=date>="2026-01-01"
  ?`https://boatraceopenapi.github.io/api/v1/${y}/${ymd}.json`
  :`https://boatraceopenapi.github.io/programs/v3/${y}/${ymd}.json`;
 try{const r=await fetch(endpoint,{cache:"force-cache"});return r.ok?await r.json():null}catch(e){return null}
}
function scanProgramRacers(j,cb){
 const sts=j?.programs?.stadiums||j?.stadiums||{};
 for(const st of Object.values(sts)){
  const races=st?.races||{};
  for(const race of Object.values(races)){
   const rs=race?.racers||{};
   for(const r of Object.values(rs))cb(r)
  }
 }
}
async function loadBestClasses(rr){
 const target=new Map(rr.map(r=>[+r.number,{best:+r.rank_number||0,year:+$("date").value.slice(0,4)}]));
 const starts=["2023-07-01","2024-01-01","2024-07-01","2025-01-01","2025-07-01","2026-01-01","2026-07-01"];
 // 3-day intervals over first 24 days of each class term: 56 shared files, not per racer.
 const dates=[];
 for(const st of starts)for(let d=0;d<24;d+=3)dates.push(dateMinus(st,-d));

async function loadMeetPoints(rr){

   const nums=[...after.matchAll(/(?<!\d)(\d{1,2}\.\d{2}|\d{1,2})(?!\d)/g)].map(x=>x[1]);

   for(let i=0;i<nums.length;i++){

   }
   const a=$("meetPts"+r.entry_number),b=$("meetRank"+r.entry_number);
   if(a&&rate){a.textContent=rate;a.classList.remove("na");a.classList.add("dataLive")}

 }
}

<script>
/* Vol.026: 選手カードは初期状態で全艇コンパクト。
   ヘッダーを押すと1艇だけ展開し、他艇は自動で閉じる。 */
(function(){
  function setupRacerAccordion(){
    const cards=[...document.querySelectorAll('.card')];
    cards.forEach(card=>{
      const top=card.querySelector('.topline');
      if(!top || top.dataset.accordionReady==='1') return;
      top.dataset.accordionReady='1';
      top.setAttribute('role','button');
      top.setAttribute('tabindex','0');
      top.setAttribute('aria-expanded','false');

      const toggle=()=>{
        const willOpen=!card.classList.contains('open');
        cards.forEach(c=>{
          c.classList.remove('open');
          const t=c.querySelector('.topline');
          if(t) t.setAttribute('aria-expanded','false');
        });
        if(willOpen){
          card.classList.add('open');
          top.setAttribute('aria-expanded','true');
        }
      };
      top.addEventListener('click',toggle);
      top.addEventListener('keydown',e=>{
        if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}
      });
    });
  }

  /* Vol.026: データ更新でカードが勝手に閉じないようMutationObserverを停止。
     新しいカード生成時だけ別監視でイベントを追加し、open状態は保持する。 */
  document.addEventListener('DOMContentLoaded',setupRacerAccordion);
  setTimeout(setupRacerAccordion,0);
})();
</script>

  function setupVoice(){

    if(!SR){b.disabled=true;b.textContent='音声選択は未対応';$('voiceStatus').textContent='プルダウンから選択できます';return;}
    const r=new SR(); r.lang='ja-JP'; r.interimResults=false;

<script>
/* ===== Vol.026 今節得点率 / 得点順位 取得強化 ===== */
(function(){
  const $all=(sel,root=document)=>Array.from(root.querySelectorAll(sel));

  function txt(el){ return (el?.textContent||'').replace(/\s+/g,' ').trim(); }
  function normName(v){ return String(v||'').replace(/\s+/g,'').replace(/[髙高]/g,'高').replace(/[﨑崎]/g,'崎'); }

  function raceMeta(){
    let ymd='';
    const d=document.querySelector('input[type="date"]');
    if(d && d.value) ymd=d.value.replace(/-/g,'');
    if(!ymd){
      const now=new Date();
      const jp=new Date(now.toLocaleString("en-US",{timeZone:"Asia/Tokyo"}));
      ymd=`${jp.getFullYear()}${String(jp.getMonth()+1).padStart(2,'0')}${String(jp.getDate()).padStart(2,'0')}`;
    }
    let jcd='';
    const venue=document.querySelector('select[id*="venue"],select[id*="jcd"],select[name*="venue"],select[name*="jcd"]');
    if(venue){
      const v=String(venue.value||'');
      if(/^\d{1,2}$/.test(v)) jcd=v.padStart(2,'0');
      else {
        const map={'桐生':'01','戸田':'02','江戸川':'03','平和島':'04','多摩川':'05','浜名湖':'06','蒲郡':'07','常滑':'08','津':'09','三国':'10','びわこ':'11','住之江':'12','尼崎':'13','鳴門':'14','丸亀':'15','児島':'16','宮島':'17','徳山':'18','下関':'19','若松':'20','芦屋':'21','福岡':'22','唐津':'23','大村':'24'};
        const label=venue.options?.[venue.selectedIndex]?.text||'';
        for(const [k,val] of Object.entries(map)) if(label.includes(k)){ jcd=val; break; }
      }
    }
    if(!jcd){
      const body=document.body.innerText;
      const map={'桐生':'01','戸田':'02','江戸川':'03','平和島':'04','多摩川':'05','浜名湖':'06','蒲郡':'07','常滑':'08','津':'09','三国':'10','びわこ':'11','住之江':'12','尼崎':'13','鳴門':'14','丸亀':'15','児島':'16','宮島':'17','徳山':'18','下関':'19','若松':'20','芦屋':'21','福岡':'22','唐津':'23','大村':'24'};
      for(const [k,val] of Object.entries(map)) if(body.includes(k)){ jcd=val; break; }
    }
    return {ymd,jcd};
  }

  function racerCards(){
    return $all('.card').filter(c=>/全国勝率|今コース/.test(txt(c)));
  }

  function findField(card,label){
    const candidates=$all('div,section,article,span',card);
    for(const el of candidates){
      if(txt(el)===label || txt(el).startsWith(label+' ')){
        const parent=el.parentElement;
        if(parent && parent!==card) return parent;
      }
    }
    // fallback: data box whose text contains label
    return $all('.big>*,.small>*,.stQuick>*,.dataBox,.stat,.box',card).find(el=>txt(el).includes(label))||null;
  }

  function setField(card,label,value,cls){
    const box=findField(card,label);
    if(!box) return false;
    let valEl=$all('.v,.value,strong,b',box).find(el=>!txt(el).includes(label));
    if(!valEl){
      // try last element
      const kids=Array.from(box.children);
      valEl=kids[kids.length-1]||box;
    }
    if(valEl===box){
      box.innerHTML=`<div>${label}</div><div class="v ${cls||''}">${value}</div>`;
    } else {
      valEl.textContent=value;
      if(cls) valEl.classList.add(cls);
    }
    return true;
  }

  function parsePointchart(html){
    const doc=new DOMParser().parseFromString(html,'text/html');
    const rows=$all('tr',doc);
    const out=[];
    for(const tr of rows){
      const tds=$all('th,td',tr).map(td=>txt(td));
      if(tds.length<3) continue;
      const name=tds.find(v=>/[\u3040-\u30ff\u3400-\u9fff]{2,}/.test(v) && !/得点|順位|勝率|選手|着/.test(v));
      if(!name) continue;
      let score=null, rank=null;
      for(const v of tds){
        if(score===null && /^\d{1,2}\.\d{1,2}$/.test(v)) score=v;
        if(rank===null && /^\d{1,2}位$/.test(v)) rank=v.replace('位','');
      }
      if(score!==null || rank!==null) out.push({name:normName(name),score,rank});
    }
    return out;
  }

  async function getText(url){
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw new Error(String(r.status));
    return await r.text();
  }

  async function fetchPointData(){
    const {ymd,jcd}=raceMeta();
    if(!ymd||!jcd) throw new Error('meta');
    const official=`https://www.boatrace.jp/owpc/pc/race/pointchart?hd=${ymd}&jcd=${jcd}&rno=1`;
    const urls=[
      `https://api.allorigins.win/raw?url=${encodeURIComponent(official)}`,
      `https://corsproxy.io/?${encodeURIComponent(official)}`,
      official
    ];
    let last=null;
    for(const u of urls){
      try{
        const html=await getText(u);
        const rows=parsePointchart(html);
        if(rows.length) return rows;
      }catch(e){ last=e; }
    }
    throw last||new Error('no data');
  }

  function cardName(card){
    const el=card.querySelector('.name')||$all('h2,h3,strong,b',card).find(x=>/[\u3040-\u30ff\u3400-\u9fff]/.test(txt(x)));
    return normName(txt(el).replace(/^[1-6]\s*/,'').replace(/\b(A1|A2|B1|B2)\b/g,''));
  }

  async function applyPoints(){
    const cards=racerCards();
    if(!cards.length) return;
    try{
      const rows=await fetchPointData();
      cards.forEach(card=>{
        const n=cardName(card);
        const hit=rows.find(r=>r.name===n || r.name.includes(n) || n.includes(r.name));
        if(hit){
          setField(card,'今節得点率',hit.score?hit.score:'対象外','point-live');
          setField(card,'得点順位',hit.rank?`${hit.rank}位`:'対象外','point-live');
        }else{
          setField(card,'今節得点率','対象外','point-unavailable');
          setField(card,'得点順位','対象外','point-unavailable');
        }
      });
    }catch(e){
      cards.forEach(card=>{
        setField(card,'今節得点率','取得不可','point-unavailable');
        setField(card,'得点順位','取得不可','point-unavailable');
      });
    }
  }

  })();
</script>


<script>
/* ===== Vol.026 直前情報取得 / AI解析ゲート ===== */
(function(){
  let previewRows=null;

  function raceCode(){
    const ymd=String($("date").value||today()).replaceAll("-","");
    return ymd+String($("stadium").value).padStart(2,"0")+String($("race").value).padStart(2,"0");
  }
  function csvUrl(kind){
    const d=String($("date").value||today());
    const [y,m,day]=d.split("-");
    return `https://boatracecsv.github.io/data/previews/${kind}/${y}/${m}/${day}.csv`;
  }
  function parseCSV(text){
    text=String(text||"").replace(/^\uFEFF/,"");
    const rows=[];let row=[],cell="",q=false;
    for(let i=0;i<text.length;i++){
      const c=text[i],nx=text[i+1];
      if(q){
        if(c==='"'&&nx==='"'){cell+='"';i++}
        else if(c==='"')q=false;
        else cell+=c;
      }else{
        if(c==='"')q=true;
        else if(c===","){row.push(cell);cell=""}
        else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell=""}
        else if(c!=="\r")cell+=c;
      }
    }
    if(cell.length||row.length){row.push(cell);rows.push(row)}
    return rows;
  }
  async function fetchCsvRow(kind){
    try{
      const r=await fetch(csvUrl(kind),{cache:"no-store"});
      if(!r.ok)return null;
      const rows=parseCSV(await r.text()),code=raceCode();
      return rows.find((x,i)=>i>0&&String(x[0]).trim()===code)||null;
    }catch(e){return null}
  }
  function num(v){
    if(v==null||v==="")return null;
    const x=Number(String(v).replace(/[^\d+\-.]/g,""));
    return Number.isFinite(x)?x:null;
  }
  function fmt(v,d=2){return v==null?"—":Number(v).toFixed(d)}
  function stValue(v){
    if(v==null||v==="")return null;
    const raw=String(v).trim().toUpperCase();
    if(/^L/.test(raw))return null;
    if(/^F/.test(raw)){
      const x=num(raw.replace("F",""));
      return x==null?null:-Math.abs(x);
    }
    return num(raw);
  }
  function openApiPreview(){
    const p=currentRace?.preview,rs=p?.racers||{};
    return Array.from({length:6},(_,i)=>{
      const r=rs[String(i+1)]||{};
      return {
        boat:i+1,
        st:num(r.start_timing),
        exhibition:num(r.exhibition_time),
        tilt:num(r.tilt_adjustment)
      };
    });
  }
  function mapCsvPreview(stt,tkz,orig){
    const out=Array.from({length:6},(_,i)=>({boat:i+1,st:null,lap:null,turn:null,straight:null,exhibition:null,tilt:null,parts:"—"}));

    if(stt){
      for(let i=0;i<6;i++){
        const base=6+i*2;
        out[i].st=stValue(stt[base+1]);
      }
    }
    if(tkz){
      for(let i=0;i<6;i++){
        const base=7+i*4;
        out[i].exhibition=num(tkz[base+2]);
        out[i].tilt=num(tkz[base+3]);
      }
    }
    if(orig){
      const items=[String(orig[7]||""),String(orig[8]||""),String(orig[9]||"")];
      for(let i=0;i<6;i++){
        const base=10+i*4, vals=[num(orig[base+1]),num(orig[base+2]),num(orig[base+3])];
        items.forEach((label,k)=>{
          if(/一周/.test(label))out[i].lap=vals[k];
          else if(/まわり|回り/.test(label))out[i].turn=vals[k];
          else if(/直線/.test(label))out[i].straight=vals[k];
        });
      }
    }
    return out;
  }
  function mergePreview(base,csv){
    return base.map((x,i)=>({
      ...csv[i],
      st:x.st!=null?x.st:csv[i].st,
      exhibition:x.exhibition!=null?x.exhibition:csv[i].exhibition,
      tilt:x.tilt!=null?x.tilt:csv[i].tilt
    }));
  }
  function cellClass(rows,key,idx,isST=false){
    const v=rows[idx][key];
    if(v==null)return"";
    if(isST&&v<0)return"hlF";
    const vals=rows.map(x=>x[key]).filter(x=>x!=null&&(!isST||x>=0));
    if(!vals.length)return"";
    const distinct=[...new Set(vals.map(Number))].sort((a,b)=>a-b);
    if(v===distinct[0])return"hl1";
    if(distinct.length>1&&v===distinct[1])return"hl2";
    if(distinct.length>2&&v===distinct[distinct.length-1])return"hlLast";
    return"";
  }
  function render(rows){
    const body=$("previewBody");
    body.innerHTML=rows.map((r,i)=>{
      const st=r.st==null?"—":(r.st<0?`-${Math.abs(r.st).toFixed(2)}`:r.st.toFixed(2));
      return `<tr>
        <td class="boatCol b${r.boat}">${r.boat}</td>
        <td class="${cellClass(rows,"st",i,true)}">${st}</td>
        <td class="majorMetric ${cellClass(rows,"lap",i)}">${fmt(r.lap)}</td>
        <td class="${cellClass(rows,"turn",i)}">${fmt(r.turn)}</td>
        <td class="${cellClass(rows,"straight",i)}">${fmt(r.straight)}</td>
        <td class="majorMetric ${cellClass(rows,"exhibition",i)}">${fmt(r.exhibition)}</td>
        <td>${r.tilt==null?"—":Number(r.tilt).toFixed(1)}</td>
        <td class="partsCol">${r.parts||"—"}</td>
      </tr>`;
    }).join("");
  }

  function cleanPartText(cell){
    if(!cell)return"";
    const t=(cell.textContent||"").replace(/\s+/g,"").trim();
    const alts=[...cell.querySelectorAll("img")].map(img=>img.alt||img.title||"").filter(Boolean).join(" ");
    const all=(t+" "+alts).trim();
    if(!all||all===" ")return"";
    return all.replace(/ピストンピストン/g,"ピストン")
      .replace(/リングピストンリング/g,"ピストンリング")
      .replace(/電気電気一式/g,"電気一式")
      .replace(/キャブキャブレター/g,"キャブレター")
      .replace(/シリンダシリンダ/g,"シリンダ")
      .replace(/シャフトクランクシャフト/g,"クランクシャフト")
      .replace(/ギヤギヤケース/g,"ギヤケース")
      .replace(/キャリボキャリアボデー/g,"キャリアボデー");
  }
  async function fetchParts(){
    const d=String($("date").value||today()).replaceAll("-","");
    const j=String($("stadium").value).padStart(2,"0"),r=String($("race").value);
    const target=`https://www.boatrace.jp/owpc/pc/race/beforeinfo?hd=${d}&jcd=${j}&rno=${r}`;
    try{
      const html=await fetchTextCors(target);
      const doc=new DOMParser().parseFromString(html,"text/html");
      const table=[...doc.querySelectorAll("table")].find(t=>(t.textContent||"").includes("部品交換"));
      if(!table)return Array(6).fill("—");
      const ans=Array(6).fill("—");
      [...table.querySelectorAll("tr")].forEach(tr=>{
        const cells=[...tr.querySelectorAll("th,td")];
        const b=Number((cells[0]?.textContent||"").trim());
        if(b<1||b>6)return;
        const part=cells[7] ? cleanPartText(cells[7]) : "";
        ans[b-1]=part||"—";
      });
      return ans;
    }catch(e){return Array(6).fill("—")}
  }

  async function getPreview(){
    if(!currentRace){$("previewState").textContent="先に出走表を取得してください";return}
    const btn=$("getPreview"),ai=$("aiAnalyze");
    btn.disabled=true;ai.disabled=true;
    $("previewPanel").classList.remove("hide");
    $("aiPanel").classList.add("hide");
    $("previewState").textContent="直前情報を取得中…";
    $("previewBody").innerHTML="";
    try{
      /* OpenAPIを現在値の主系統、CSVをオリジナル展示補完に使用 */
      const latest=await fetch(url($("date").value),{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null);
      if(latest){
        const fresh=raceOf(latest,$("stadium").value,$("race").value);
        if(fresh){currentRace=fresh}
      }
      const [stt,tkz,orig,parts]=await Promise.all([
        fetchCsvRow("stt"),fetchCsvRow("tkz"),fetchCsvRow("original_exhibition"),fetchParts()
      ]);
      const rows=mergePreview(openApiPreview(),mapCsvPreview(stt,tkz,orig));
      rows.forEach((x,i)=>x.parts=parts[i]||"—");
      previewRows=rows;
      render(rows);

      const core=rows.filter(x=>x.st!=null||x.exhibition!=null).length;
      const original=rows.filter(x=>x.lap!=null||x.turn!=null||x.straight!=null).length;
      $("previewState").textContent=`取得完了：基本 ${core}/6艇・オリジナル展示 ${original}/6艇`;
      const now=new Date();
      $("previewStamp").textContent=`取得 ${now.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}`;
      ai.disabled=false;
    }catch(e){
      $("previewState").textContent="直前情報を取得できませんでした。展示公開前の可能性があります";
      previewRows=null;
    }finally{
      btn.disabled=false;
    }
  }

  async function aiAnalyze(){
    if(!currentRace){
      $("status").textContent="先に出走表を取得してください";
      return;
    }
    const ai=$("aiAnalyze");
    ai.disabled=true;
    ai.textContent="AI解析中…";

    /* 直前情報未取得ならAI解析側から先に取得する */
    if(!previewRows){
      await getPreview();
    }
    if(!previewRows){
      ai.disabled=false;
      ai.textContent="AI解析";
      $("status").textContent="直前情報を取得できないためAI解析を開始できません";
      return;
    }

    window.__HUNTER_PREVIEW=JSON.parse(JSON.stringify(previewRows));
    window.__HUNTER_RACE=currentRace;
    $("aiPanel").classList.remove("hide");
    $("status").textContent="✓ AI解析データ準備完了";
    ai.textContent="AI解析済み";
    ai.disabled=false;
  }

  window.resetHunterPreflight=function(){
    previewRows=null;
    if($("getPreview"))$("getPreview").disabled=true;
    if($("aiAnalyze"))$("aiAnalyze").disabled=true;
    if($("previewPanel"))$("previewPanel").classList.add("hide");
    if($("aiPanel"))$("aiPanel").classList.add("hide");
  };

  $("getPreview")?.addEventListener("click",getPreview);
  $("aiAnalyze")?.addEventListener("click",aiAnalyze);
})();
</script>
