<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>家計簿</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}
:root{
  --bg:#090b10;--card:#151923;--card2:#1c2230;--text:#fff;--muted:#9aa4b2;
  --blue:#2487ff;--green:#22c55e;--orange:#ff8a1f;--purple:#9b6cff;
  --red:#ff4d5e;--yellow:#f4c542;--line:#2a3242
}
body{margin:0;background:linear-gradient(180deg,#090b10,#101521);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.screen{min-height:100vh}
.wrap{max-width:760px;margin:auto;padding:24px 18px 42px}
.hero{padding:34px 4px 24px;text-align:center}
.hero h1{font-size:38px;margin:0 0 8px;font-weight:950;letter-spacing:.5px}
.hero p{margin:0;color:var(--muted);font-size:17px}
.home-actions{display:grid;gap:26px;margin-top:30px}
.big-choice{
  width:100%;min-height:154px;border:0;border-radius:28px;padding:24px;
  color:#fff;text-align:left;display:flex;align-items:center;gap:20px;
  box-shadow:0 14px 35px rgba(0,0,0,.24);transition:.15s transform
}
.big-choice:active{transform:scale(.985)}
.big-choice.book{background:linear-gradient(135deg,#1677ff,#21b66f)}
.big-choice.search{background:linear-gradient(135deg,#ff7a18,#ffb11b)}
.choice-icon{font-size:52px;flex:none}
.choice-title{font-size:31px;font-weight:950}
.choice-sub{font-size:15px;margin-top:7px;opacity:.9;line-height:1.5}
.topbar{display:flex;align-items:center;gap:14px;margin:8px 0 24px}
.back{
  min-width:52px;min-height:52px;border:1px solid var(--line);border-radius:16px;
  background:#171c27;color:#fff;font-size:25px;font-weight:900
}
.page-title{font-size:29px;font-weight:950}
.section-title{font-size:22px;font-weight:950;margin:26px 2px 14px}
.menu-grid{display:grid;gap:18px}
.menu-btn{
  width:100%;min-height:92px;border:1px solid var(--line);border-radius:22px;
  padding:18px 20px;color:#fff;background:var(--card);display:flex;align-items:center;gap:17px;text-align:left
}
.menu-btn .ico{font-size:36px}.menu-btn b{display:block;font-size:21px}.menu-btn span{display:block;color:#b7c0ce;margin-top:5px;font-size:14px}
.menu-btn.receipt{border-color:#2c7fff;background:linear-gradient(135deg,#132b55,#17233a)}
.menu-btn.stats{border-color:#31b96b;background:linear-gradient(135deg,#123524,#17251e)}
.menu-btn.history{border-color:#8b6cff;background:linear-gradient(135deg,#2a2143,#211d30)}
.period{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.period button{min-height:52px;border:1px solid var(--line);border-radius:15px;background:#171c27;color:#cbd3df;font-weight:900}
.period button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.summary{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px}
.summary-label{color:var(--muted);font-size:14px}.summary-total{font-size:38px;font-weight:950;margin-top:4px}
.category-list{display:grid;gap:13px;margin-top:16px}
.category{
  border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--card2)
}
.category-head{display:flex;justify-content:space-between;gap:12px;align-items:center}
.category-name{font-size:19px;font-weight:900}.category-val{text-align:right;font-weight:900}
.bar{height:12px;background:#2b3342;border-radius:999px;margin-top:12px;overflow:hidden}
.bar>div{height:100%;border-radius:999px}
.searchbox{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px}
.searchbox label{display:block;font-size:17px;font-weight:900;margin-bottom:10px}
.search-row{display:grid;grid-template-columns:1fr;gap:14px}
.search-input{width:100%;min-height:60px;border:2px solid #3b465b;border-radius:17px;background:#0d1119;color:#fff;padding:0 17px;font-size:20px;outline:none}
.search-input:focus{border-color:var(--orange)}
.primary{
  width:100%;min-height:60px;border:0;border-radius:17px;background:var(--orange);color:#fff;font-size:19px;font-weight:950
}
.result{margin-top:22px;display:grid;gap:15px}
.result-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:19px}
.result-name{font-size:25px;font-weight:950}.badge{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:999px;background:#213c2a;color:#72e79b;font-size:13px;font-weight:900}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:17px}
.info{background:#0f141d;border-radius:15px;padding:13px}.info small{display:block;color:var(--muted);margin-bottom:5px}.info b{font-size:17px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.camera-box{position:relative;overflow:hidden;border-radius:22px;background:#050505;border:1px solid var(--line)}
video{display:block;width:100%;min-height:330px;background:#000}
.scan-frame{position:absolute;left:6%;right:6%;top:8%;bottom:8%;border:3px solid #32a4ff;border-radius:18px;pointer-events:none}
.guide{position:absolute;left:10px;right:10px;top:18px;text-align:center;font-weight:950;text-shadow:0 2px 6px #000}
.camera-status{margin:16px 0;padding:15px;background:var(--card);border-radius:16px;font-size:18px;font-weight:850}
.action-stack{display:grid;gap:16px;margin-top:18px}
.secondary,.danger{width:100%;min-height:58px;border-radius:16px;font-size:18px;font-weight:900}
.secondary{background:#252c39;color:#fff;border:1px solid #394355}.danger{background:#421a20;color:#ff8d99;border:1px solid #70313a}
.form-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:18px}
.field{margin-bottom:16px}.field:last-child{margin-bottom:0}.field label{display:block;font-weight:900;margin-bottom:8px}
.field input,.field select{width:100%;min-height:54px;border:1px solid #3b465b;border-radius:14px;background:#0e131c;color:#fff;padding:0 14px;font-size:17px}
.item-row{background:#111722;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:13px}
.item-grid{display:grid;grid-template-columns:1fr 105px;gap:10px}
.item-grid input{width:100%;min-height:50px;border:1px solid #3b465b;border-radius:13px;background:#0b1018;color:#fff;padding:0 12px;font-size:16px}
.item-tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.item-tools select{min-height:48px;border:1px solid #3b465b;border-radius:13px;background:#0b1018;color:#fff;padding:0 9px}
.remove{margin-top:12px;width:100%;min-height:48px;border:1px solid #70313a;border-radius:13px;background:#36161b;color:#ff8d99;font-weight:900}
.note{color:var(--muted);font-size:13px;line-height:1.55;margin-top:10px}
.ocr-note{margin-top:10px;padding:10px 12px;border-radius:12px;background:#132236;color:#8bc8ff;font-size:13px;line-height:1.45}
.jan-input{width:100%;min-height:46px;margin-top:10px;border:1px solid #354155;border-radius:13px;background:#0b1018;color:#b9c7da;padding:0 12px;font-size:14px}
canvas{display:none}
@media(max-width:390px){
  .wrap{padding-left:15px;padding-right:15px}.hero h1{font-size:34px}.big-choice{min-height:142px}.choice-title{font-size:27px}
  .info-grid{grid-template-columns:1fr}.item-grid{grid-template-columns:1fr 90px}
}
</style>
</head>
<body>
<section id="homeScreen" class="screen">
  <div class="wrap">
    <div class="hero"><h1>わが家のお金</h1><p>家計と「これ買ったっけ？」をひとつに</p></div>
    <div class="home-actions">
      <button id="openBook" class="big-choice book"><div class="choice-icon">💰</div><div><div class="choice-title">家計簿</div><div class="choice-sub">レシート登録・支出グラフ・購入履歴</div></div></button>
      <button id="openSearch" class="big-choice search"><div class="choice-icon">🔍</div><div><div class="choice-title">購入検索</div><div class="choice-sub">いつ・どこで・いくらで買ったかを検索</div></div></button>
    </div>
  </div>
</section>

<section id="bookScreen" class="screen hidden"><div class="wrap">
  <div class="topbar"><button class="back" data-home>←</button><div class="page-title">家計簿</div></div>
  <div class="menu-grid">
    <button id="openReceipt" class="menu-btn receipt"><div class="ico">📷</div><div><b>レシートを登録</b><span>撮影して読み取り。読めない所は手入力できます</span></div></button>
    <button id="openStats" class="menu-btn stats"><div class="ico">📊</div><div><b>家計分析</b><span>月・半年・年間で支出を確認</span></div></button>
    <button id="openHistory" class="menu-btn history"><div class="ico">🧾</div><div><b>購入履歴</b><span>登録した買い物を新しい順に確認</span></div></button>
  </div>
</div></section>

<section id="statsScreen" class="screen hidden"><div class="wrap">
  <div class="topbar"><button class="back" data-book>←</button><div class="page-title">家計分析</div></div>
  <div class="period"><button data-period="month" class="active">月</button><button data-period="half">半年</button><button data-period="year">年間</button></div>
  <div class="summary"><div class="summary-label">対象期間の支出</div><div id="totalSpend" class="summary-total">¥0</div><div id="categoryList" class="category-list"></div></div>
  <div class="note">カテゴリーを押すと、牛乳・コーヒー・漂白剤などの詳細分類を表示する機能へ拡張できる構造です。</div>
</div></section>

<section id="searchScreen" class="screen hidden"><div class="wrap">
  <div class="topbar"><button class="back" data-home>←</button><div class="page-title">購入検索</div></div>
  <div class="searchbox"><label for="searchInput">これ買ったっけ？</label><div class="search-row"><input id="searchInput" class="search-input" placeholder="例：牛乳、コーヒー、漂白剤"><button id="searchBtn" class="primary">🔍 購入履歴を検索</button></div></div>
  <div id="searchResults" class="result"><div class="empty">商品名を入力すると、最終購入日・店舗・価格などを表示します。</div></div>
</div></section>

<section id="historyScreen" class="screen hidden"><div class="wrap">
  <div class="topbar"><button class="back" data-book>←</button><div class="page-title">購入履歴</div></div>
  <div id="historyList" class="result"></div>
</div></section>

<section id="cameraScreen" class="screen hidden"><div class="wrap">
  <div class="topbar"><button id="cancelCamera" class="back">←</button><div class="page-title">レシート撮影</div></div>
  <div class="camera-box"><video id="video" autoplay playsinline muted></video><div class="scan-frame"></div><div class="guide">レシート全体をできるだけ枠内へ</div></div>
  <div id="cameraStatus" class="camera-status">カメラ待機中</div>
  <div class="action-stack"><button id="captureReceipt" class="primary">📸 このレシートを読み取る</button><button id="manualEntry" class="secondary">⌨️ 読み取れないので手入力</button></div>
</div></section>

<section id="editScreen" class="screen hidden"><div class="wrap">
  <div class="topbar"><button id="backFromEdit" class="back">←</button><div class="page-title">内容確認・修正</div></div>
  <div class="form-card">
    <div class="field"><label>店舗名</label><input id="storeInput" placeholder="例：○○スーパー"></div>
    <div class="field"><label>購入日</label><input id="dateInput" type="date"></div>
  </div>
  <div class="section-title">購入商品</div>
  <div id="itemsEditor"></div>
  <div class="action-stack"><button id="addItem" class="secondary">＋ 商品を手入力で追加</button><button id="saveReceipt" class="primary">✅ 家計簿に保存</button><button id="discardReceipt" class="danger">この入力を破棄</button></div>
  <div class="note">OCR結果が間違っていても、商品名・価格・数量・分類をすべて手入力で修正できます。</div>
  <div class="ocr-note">💡 JANコードが読めた商品は、修正した商品名を端末内に学習します。次回から同じJANコードの商品名を自動補正します。</div>
</div></section>

<canvas id="canvas"></canvas>

<script>
const DATA_KEY="kakeibo_purchases_v1";
const PRODUCT_DICT_KEY="kakeibo_product_dictionary_v1";
const OCR_ALIAS_KEY="kakeibo_ocr_aliases_v1";
const screens=[homeScreen,bookScreen,statsScreen,searchScreen,historyScreen,cameraScreen,editScreen];
const CATEGORY_MAP={
  "飲み物":["牛乳","コーヒー","お茶","ジュース","水","飲料"],
  "生活品":["漂白剤","リンス","コンディショナー","シャンプー","洗剤","ティッシュ","トイレットペーパー"],
  "食品":["米","パン","卵","肉","魚","野菜","豆腐","納豆"],
  "お菓子":["チョコ","菓子","アイス","クッキー"],
  "外食":["外食"]
};
let stream=null,ocrWorker=null,ocrReadyPromise=null,currentItems=[];
let lastOCRMeta={store:"",date:""};

function show(screen){screens.forEach(s=>s.classList.add("hidden"));screen.classList.remove("hidden");window.scrollTo(0,0)}
document.querySelectorAll("[data-home]").forEach(b=>b.addEventListener("click",()=>{stopCamera();show(homeScreen)}));
document.querySelectorAll("[data-book]").forEach(b=>b.addEventListener("click",()=>show(bookScreen)));
openBook.addEventListener("click",()=>show(bookScreen));
openSearch.addEventListener("click",()=>show(searchScreen));
openStats.addEventListener("click",()=>{show(statsScreen);renderStats("month")});
openHistory.addEventListener("click",()=>{show(historyScreen);renderHistory()});
openReceipt.addEventListener("click",openCamera);
cancelCamera.addEventListener("click",()=>{stopCamera();show(bookScreen)});
manualEntry.addEventListener("click",()=>{stopCamera();openEditor([],"",todayText())});
backFromEdit.addEventListener("click",()=>show(bookScreen));
discardReceipt.addEventListener("click",()=>{currentItems=[];show(bookScreen)});

function loadData(){try{return JSON.parse(localStorage.getItem(DATA_KEY)||"[]")}catch(e){return[]}}
function saveData(d){localStorage.setItem(DATA_KEY,JSON.stringify(d))}
function loadJSON(key,fallback={}){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch(e){return fallback}}
function saveJSON(key,value){localStorage.setItem(key,JSON.stringify(value))}
function normalizeJan(v){return String(v||"").replace(/\D/g,"")}
function normalizeOCRKey(v){
  return String(v||"").toLowerCase().replace(/\s+/g,"").replace(/[＊*#¥￥・･.,，。:：;；'"`~〜ー\-_/\\()[\]{}]/g,"").trim()
}
function getLearnedProduct(jan,rawName){
  const dict=loadJSON(PRODUCT_DICT_KEY,{});
  const aliases=loadJSON(OCR_ALIAS_KEY,{});
  const j=normalizeJan(jan);
  if(j && dict[j]) return dict[j];
  const key=normalizeOCRKey(rawName);
  if(key && aliases[key]) return aliases[key];
  return null;
}
function learnProduct(it){
  const corrected={
    name:String(it.name||"").trim(),
    group:String(it.group||it.name||"").trim(),
    category:it.category||"その他"
  };
  if(!corrected.name)return;
  const j=normalizeJan(it.jan);
  if(j){
    const dict=loadJSON(PRODUCT_DICT_KEY,{});
    dict[j]=corrected;
    saveJSON(PRODUCT_DICT_KEY,dict);
  }
  const raw=String(it.rawName||"").trim();
  if(raw && normalizeOCRKey(raw)!==normalizeOCRKey(corrected.name)){
    const aliases=loadJSON(OCR_ALIAS_KEY,{});
    aliases[normalizeOCRKey(raw)]=corrected;
    saveJSON(OCR_ALIAS_KEY,aliases);
  }
}
function yen(n){return "¥"+Math.round(Number(n)||0).toLocaleString("ja-JP")}
function todayText(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function classify(name){
  const s=String(name||"").toLowerCase();
  for(const [cat,words] of Object.entries(CATEGORY_MAP)){
    for(const w of words){if(s.includes(w.toLowerCase())) return {category:cat,group:w==="飲料"?name:w}}
  }
  return {category:"その他",group:name||"未分類"};
}

async function openCamera(){
  show(cameraScreen);cameraStatus.textContent="カメラ起動中…";
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    video.srcObject=stream;await video.play();cameraStatus.textContent="レシートを枠内に入れてください";
  }catch(e){cameraStatus.textContent="カメラを起動できません。手入力を利用してください。"}
}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}
function prepareOCR(){
  if(ocrReadyPromise)return ocrReadyPromise;
  ocrReadyPromise=(async()=>{
    ocrWorker=await Tesseract.createWorker("jpn+eng");
    await ocrWorker.setParameters({
      preserve_interword_spaces:"1"
    });
    return ocrWorker;
  })();
  return ocrReadyPromise;
}

function buildEnhancedCanvas(sourceCanvas){
  const out=document.createElement("canvas");
  const scale=1.8;
  out.width=Math.round(sourceCanvas.width*scale);
  out.height=Math.round(sourceCanvas.height*scale);
  const ctx=out.getContext("2d",{willReadFrequently:true});
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(sourceCanvas,0,0,out.width,out.height);

  const img=ctx.getImageData(0,0,out.width,out.height);
  const d=img.data;
  let sum=0;
  for(let i=0;i<d.length;i+=4){
    const y=Math.round(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114);
    sum+=y;
  }
  const avg=sum/(d.length/4);
  const threshold=Math.max(145,Math.min(205,avg-18));
  for(let i=0;i<d.length;i+=4){
    const y=Math.round(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114);
    // Strong contrast without turning faint print completely white.
    let v=(y-threshold)*1.55+150;
    v=Math.max(0,Math.min(255,v));
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(img,0,0);
  return out;
}

async function recognizeReceipt(sourceCanvas){
  const worker=await prepareOCR();
  cameraStatus.textContent="🔍 1/2 日本語を読み取り中…";
  await worker.setParameters({tessedit_pageseg_mode:"6"});
  const first=await worker.recognize(sourceCanvas);

  cameraStatus.textContent="✨ 2/2 画像補正して再解析中…";
  const enhanced=buildEnhancedCanvas(sourceCanvas);
  await worker.setParameters({tessedit_pageseg_mode:"6"});
  const second=await worker.recognize(enhanced);

  const a=first.data.text||"", b=second.data.text||"";
  // Keep both passes. Parser de-duplicates products and can recover lines one pass missed.
  return a+"\n"+b;
}

captureReceipt.addEventListener("click",async()=>{
  if(!video.videoWidth){cameraStatus.textContent="カメラ映像を取得できません";return}
  captureReceipt.disabled=true;cameraStatus.textContent="📸 画像を取り込み中…";
  try{
    canvas.width=video.videoWidth;canvas.height=video.videoHeight;
    canvas.getContext("2d").drawImage(video,0,0);
    const text=await recognizeReceipt(canvas);
    const parsed=parseReceipt(text);
    stopCamera();
    openEditor(parsed.items,parsed.store,parsed.date);
  }catch(e){
    console.error(e);
    cameraStatus.textContent="読み取りに失敗しました。手入力で登録できます。";
  }finally{captureReceipt.disabled=false}
});

function extractReceiptDate(lines){
  const joined=lines.join(" ");
  let m=joined.match(/(20\d{2})\s*[年\/.\-]\s*(\d{1,2})\s*[月\/.\-]\s*(\d{1,2})\s*日?/);
  if(!m)m=joined.match(/(20\d{2})(\d{2})(\d{2})/);
  if(!m)return todayText();
  return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
}

function extractStore(lines){
  const top=lines.slice(0,18).filter(Boolean);
  const strong=/スーパー|ストア|ドラッグ|薬局|マート|アオキ|イオン|ベイシア|ヤオコー|カスミ|とりせん|セブン|ローソン|ファミリーマート|ドン.?キホーテ/i;
  const noise=/TEL|電話|登録番号|株式会社|レシート|領収|パート|アルバイト|ホームページ|募集|営業時間/i;
  const hit=top.find(x=>strong.test(x)&&!noise.test(x));
  if(hit)return cleanupStore(hit);
  const japanese=top.filter(x=>/[ぁ-んァ-ヶ一-龠]/.test(x)&&!noise.test(x)&&x.length<=28);
  return japanese.length?cleanupStore(japanese[0]):"";
}
function cleanupStore(v){
  return String(v||"").replace(/^[*＊#\s]+/,"").replace(/\s{2,}/g," ").trim();
}

function parseReceipt(text){
  const rawLines=String(text).split(/\r?\n/).map(x=>x.replace(/[|｜]/g," ").replace(/\s+/g," ").trim()).filter(Boolean);
  const store=extractStore(rawLines);
  const date=extractReceiptDate(rawLines);
  const out=[],seen=new Set();
  let pendingJan="";

  for(let idx=0;idx<rawLines.length;idx++){
    const line=rawLines[idx];

    // JAN/EAN/UPC printed on its own line is common on Japanese receipts.
    const janOnly=line.replace(/\s/g,"").match(/(?:^|\D)(\d{8}|\d{12,13})(?:\D|$)/);
    if(janOnly && line.replace(/\D/g,"").length<=14){
      pendingJan=janOnly[1];
      continue;
    }

    // Allow "商品名   ¥178", "商品名 178", and OCR variants with ￥/Y.
    const m=line.match(/^(.{1,60}?)\s+(?:[¥￥Yy]\s*)?([0-9]{2,6})(?:\s*円)?\s*$/);
    if(!m)continue;

    let rawName=m[1].replace(/[¥￥*＊#]/g,"").trim();
    const price=Number(m[2]);
    if(!rawName||!price)continue;
    if(/合計|小計|現金|お預|お釣|消費税|税込|税額|対象額|ポイント|値引|割引|お買上|領収|内税|外税/.test(rawName))continue;
    if(/^\d+$/.test(rawName))continue;

    let jan=pendingJan;
    pendingJan="";

    const learned=getLearnedProduct(jan,rawName);
    let name=learned?.name||rawName;
    let category=learned?.category;
    let group=learned?.group;
    if(!category||!group){
      const c=classify(name);
      category=category||c.category;
      group=group||c.group;
    }

    const key=(normalizeJan(jan)||normalizeOCRKey(name))+"|"+price;
    if(seen.has(key))continue;
    seen.add(key);
    out.push({name,rawName,price,qty:1,category,group,jan});
    if(out.length>=50)break;
  }
  return {store,date,items:out};
}

function openEditor(items,store="",date=""){
  currentItems=items.length?items:[{name:"",rawName:"",price:"",qty:1,category:"その他",group:"",jan:""}];
  lastOCRMeta={store:store||"",date:date||todayText()};
  storeInput.value=lastOCRMeta.store;
  dateInput.value=lastOCRMeta.date;
  renderEditor();
  show(editScreen);
}
function renderEditor(){
  itemsEditor.innerHTML="";
  currentItems.forEach((it,i)=>{
    const div=document.createElement("div");div.className="item-row";
    const learned=it.jan?getLearnedProduct(it.jan,it.rawName):null;
    div.innerHTML=`<div class="item-grid">
      <input data-f="name" data-i="${i}" value="${escapeHtml(it.name)}" placeholder="商品名">
      <input data-f="price" data-i="${i}" type="number" min="0" value="${it.price}" placeholder="価格">
    </div>
    <div class="item-tools">
      <select data-f="category" data-i="${i}">${["飲み物","食品","生活品","お菓子","外食","その他"].map(c=>`<option ${c===it.category?"selected":""}>${c}</option>`).join("")}</select>
      <input data-f="qty" data-i="${i}" type="number" min="1" value="${it.qty||1}" aria-label="数量" placeholder="数量">
    </div>
    <input style="width:100%;min-height:48px;margin-top:10px;border:1px solid #3b465b;border-radius:13px;background:#0b1018;color:#fff;padding:0 12px" data-f="group" data-i="${i}" value="${escapeHtml(it.group||"")}" placeholder="まとめ名 例：牛乳">
    <input class="jan-input" data-f="jan" data-i="${i}" inputmode="numeric" value="${escapeHtml(it.jan||"")}" placeholder="JANコード（読めた場合）">
    ${it.rawName&&it.rawName!==it.name?`<div class="ocr-note">OCR原文：${escapeHtml(it.rawName)}${learned?"<br>✨ 保存済みの商品辞書で自動補正":""}</div>`:""}
    <button class="remove" data-remove="${i}">この商品を削除</button>`;
    itemsEditor.appendChild(div);
  });

  itemsEditor.querySelectorAll("[data-f]").forEach(el=>{
    const evt=(el.tagName==="SELECT")?"change":"input";
    el.addEventListener(evt,e=>{
      const i=Number(e.target.dataset.i),f=e.target.dataset.f;
      currentItems[i][f]=e.target.value;
      if(f==="name" && !currentItems[i].group){
        const c=classify(e.target.value);
        currentItems[i].category=c.category;
        currentItems[i].group=c.group;
      }
    });
  });

  itemsEditor.querySelectorAll("[data-remove]").forEach(b=>b.addEventListener("click",()=>{
    currentItems.splice(Number(b.dataset.remove),1);
    if(!currentItems.length)currentItems.push({name:"",rawName:"",price:"",qty:1,category:"その他",group:"",jan:""});
    renderEditor();
  }));
}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
addItem.addEventListener("click",()=>{currentItems.push({name:"",rawName:"",price:"",qty:1,category:"その他",group:"",jan:""});renderEditor()});
saveReceipt.addEventListener("click",()=>{
  const store=storeInput.value.trim()||"店舗未入力",date=dateInput.value||todayText();
  const items=currentItems.map(it=>({
    name:String(it.name||"").trim(),
    rawName:String(it.rawName||"").trim(),
    price:Number(it.price)||0,
    qty:Math.max(1,Number(it.qty)||1),
    category:it.category||"その他",
    group:String(it.group||it.name||"未分類").trim(),
    jan:normalizeJan(it.jan)
  })).filter(it=>it.name&&it.price>0);
  if(!items.length){alert("商品名と価格を1件以上入力してください");return}

  items.forEach(learnProduct);

  const data=loadData();
  data.push({id:Date.now(),store,date,items});
  saveData(data);
  show(bookScreen);
});

function inPeriod(date,period){
  const d=new Date(date+"T00:00:00"),now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),1);
  if(period==="half")start=new Date(now.getFullYear(),now.getMonth()-5,1);
  if(period==="year")start=new Date(now.getFullYear(),0,1);
  return d>=start&&d<=now
}
document.querySelectorAll("[data-period]").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("[data-period]").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderStats(b.dataset.period)
}));
function renderStats(period){
  const data=loadData().filter(r=>inPeriod(r.date,period)),sums={};
  let total=0;
  data.forEach(r=>r.items.forEach(it=>{const v=it.price*it.qty;total+=v;sums[it.category]=(sums[it.category]||0)+v}));
  totalSpend.textContent=yen(total);categoryList.innerHTML="";
  const colors={"飲み物":"#2997ff","食品":"#30d158","生活品":"#a06cff","お菓子":"#ffd60a","外食":"#ff453a","その他":"#8e8e93"};
  Object.entries(sums).sort((a,b)=>b[1]-a[1]).forEach(([cat,val])=>{
    const pct=total?val/total*100:0,div=document.createElement("div");div.className="category";
    div.innerHTML=`<div class="category-head"><div class="category-name">${cat}</div><div class="category-val">${yen(val)}<br><small>${pct.toFixed(1)}%</small></div></div><div class="bar"><div style="width:${pct}%;background:${colors[cat]||colors["その他"]}"></div></div>`;
    categoryList.appendChild(div)
  });
  if(!total)categoryList.innerHTML='<div class="empty">この期間のデータはまだありません。</div>'
}

searchBtn.addEventListener("click",runSearch);
searchInput.addEventListener("keydown",e=>{if(e.key==="Enter")runSearch()});
function runSearch(){
  const q=searchInput.value.trim().toLowerCase();if(!q){searchResults.innerHTML='<div class="empty">商品名を入力してください。</div>';return}
  const hits=[];
  loadData().forEach(r=>r.items.forEach(it=>{
    if([it.name,it.group,it.category,it.jan].some(v=>String(v||"").toLowerCase().includes(q)))hits.push({...it,date:r.date,store:r.store})
  }));
  hits.sort((a,b)=>b.date.localeCompare(a.date));searchResults.innerHTML="";
  if(!hits.length){searchResults.innerHTML='<div class="empty">購入履歴が見つかりませんでした。</div>';return}
  const min=hits.reduce((a,b)=>a.price<=b.price?a:b);
  const latest=hits[0];
  const card=document.createElement("div");card.className="result-card";
  card.innerHTML=`<div class="result-name">${escapeHtml(latest.group||latest.name)}</div><div class="badge">最終購入 ${escapeHtml(latest.date)}</div>
  <div class="info-grid"><div class="info"><small>最後に買った店舗</small><b>${escapeHtml(latest.store)}</b></div><div class="info"><small>最後の価格</small><b>${yen(latest.price)}</b></div><div class="info"><small>最安値</small><b>${yen(min.price)}</b></div><div class="info"><small>最安値の店舗</small><b>${escapeHtml(min.store)}</b></div></div>`;
  searchResults.appendChild(card);
  hits.slice(0,20).forEach(h=>{
    const d=document.createElement("div");d.className="result-card";
    d.innerHTML=`<b>${escapeHtml(h.date)}　${escapeHtml(h.store)}</b><div style="margin-top:8px;color:#cbd3df">${escapeHtml(h.name)} ／ ${yen(h.price)} ／ ${h.qty}個</div>`;
    searchResults.appendChild(d)
  })
}
function renderHistory(){
  const data=loadData().sort((a,b)=>b.date.localeCompare(a.date));historyList.innerHTML="";
  if(!data.length){historyList.innerHTML='<div class="empty">購入履歴はまだありません。</div>';return}
  data.forEach(r=>{
    const total=r.items.reduce((s,it)=>s+it.price*it.qty,0),d=document.createElement("div");d.className="result-card";
    d.innerHTML=`<div class="result-name">${escapeHtml(r.store)}</div><div class="badge">${escapeHtml(r.date)}</div><div style="margin-top:13px;font-size:21px;font-weight:900">${yen(total)}</div><div style="margin-top:9px;color:#b7c0ce">${r.items.slice(0,5).map(it=>escapeHtml(it.group||it.name)).join("・")}${r.items.length>5?" ほか":""}</div>`;
    historyList.appendChild(d)
  })
}
</script>
