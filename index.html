<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>切替確認</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0b0b0c;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.container{
  max-width:720px;
  margin:auto;
  padding:18px;
}
h1{
  text-align:center;
  margin:8px 0 20px;
  font-size:30px;
}
.target-box,.card,.camera-box{
  background:#18181b;
  border-radius:16px;
  padding:16px;
}
.target-box{
  border:1px solid #333;
  margin-bottom:16px;
}
.label{
  color:#a9a9ad;
  font-size:14px;
  margin-bottom:7px;
}
.target-value{
  font-size:30px;
  font-weight:900;
  letter-spacing:2px;
}
.camera-box{padding:14px}
.video-wrap{
  position:relative;
  overflow:hidden;
  border-radius:14px;
  background:#000;
}
video{
  width:100%;
  display:none;
  background:#000;
  border-radius:14px;
}
.scan-frame{
  position:absolute;
  left:9%;
  right:9%;
  top:34%;
  height:28%;
  border:3px solid #0a84ff;
  border-radius:14px;
  pointer-events:none;
  display:none;
}
.scan-guide{
  position:absolute;
  left:0;
  right:0;
  bottom:12px;
  text-align:center;
  font-size:14px;
  font-weight:700;
  text-shadow:0 1px 4px #000;
  display:none;
}
.complete-overlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  background:rgba(0,0,0,.58);
  padding:20px;
  pointer-events:none;
}
.complete-overlay.show{
  display:flex;
}
.complete-mark{
  font-size:56px;
  line-height:1;
}
.complete-title{
  margin-top:10px;
  font-size:31px;
  font-weight:900;
}
.complete-value{
  margin-top:8px;
  font-size:38px;
  font-weight:900;
  letter-spacing:3px;
  color:#30d158;
}
button{
  width:100%;
  min-height:58px;
  border:0;
  border-radius:13px;
  margin-top:14px;
  font-size:18px;
  font-weight:850;
}
#cameraBtn,#retryBtn{
  background:#0a84ff;
  color:#fff;
}
#stopBtn{
  background:#3a3a3c;
  color:#fff;
  display:none;
}
#retryBtn{
  display:none;
}
.card{
  margin-top:16px;
}
#status,#currentText,#method{
  font-size:22px;
  font-weight:850;
  word-break:break-all;
}
#progress{
  margin-top:8px;
  color:#aaa;
}
.confirmed{
  border:2px solid #30d158;
}
#confirmedText{
  font-size:31px;
  font-weight:900;
  color:#30d158;
  letter-spacing:2px;
}
#confirmedMeta{
  margin-top:7px;
  color:#aaa;
  font-size:14px;
}
canvas{display:none}
</style>
</head>

<body>
<div class="container">

  <h1>切替確認</h1>

  <div class="target-box">
    <div class="label">今回の確認対象</div>
    <div class="target-value">T629C</div>
  </div>

  <div class="camera-box">
    <div class="video-wrap">
      <video id="camera" autoplay playsinline muted></video>

      <div id="scanFrame" class="scan-frame"></div>
      <div id="scanGuide" class="scan-guide">枠内に型番またはバーコードを入れてください</div>

      <div id="completeOverlay" class="complete-overlay">
        <div class="complete-mark">✅</div>
        <div class="complete-title">読み込み完了</div>
        <div id="overlayValue" class="complete-value">T629C</div>
      </div>
    </div>

    <button id="cameraBtn">📷 カメラ起動</button>
    <button id="stopBtn">カメラ停止</button>
    <button id="retryBtn">もう一度読み取る</button>
  </div>

  <div class="card">
    <div class="label">状態</div>
    <div id="status">待機中</div>
    <div id="progress">確認 0 / 2</div>
  </div>

  <div class="card">
    <div class="label">現在の読取結果</div>
    <div id="currentText">未読取</div>
  </div>

  <div class="card">
    <div class="label">読み取り方法</div>
    <div id="method">-</div>
  </div>

  <div class="card confirmed">
    <div class="label">保持データ</div>
    <div id="confirmedText">未確定</div>
    <div id="confirmedMeta">保存データなし</div>
  </div>

  <canvas id="canvas"></canvas>

</div>

<script>
const TARGET = "T629C";
const STORAGE_KEY = "kirikae_confirmed_data_v1";

const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const cameraBtn = document.getElementById("cameraBtn");
const stopBtn = document.getElementById("stopBtn");
const retryBtn = document.getElementById("retryBtn");

const scanFrame = document.getElementById("scanFrame");
const scanGuide = document.getElementById("scanGuide");
const completeOverlay = document.getElementById("completeOverlay");
const overlayValue = document.getElementById("overlayValue");

const statusEl = document.getElementById("status");
const progressEl = document.getElementById("progress");
const currentTextEl = document.getElementById("currentText");
const methodEl = document.getElementById("method");
const confirmedTextEl = document.getElementById("confirmedText");
const confirmedMetaEl = document.getElementById("confirmedMeta");

let stream = null;
let scanning = false;
let scanBusy = false;
let previousValue = "";
let sameCount = 0;
let confirmedData = null;

let barcodeDetector = null;
let ocrWorker = null;
let ocrReadyPromise = null;


/* =========================
   保存済みデータ復元
========================= */
restoreSavedData();


/* =========================
   BarcodeDetector準備
========================= */
(async () => {
  if (!("BarcodeDetector" in window)) return;

  try {
    const preferred = [
      "code_128",
      "code_39",
      "code_93",
      "ean_13",
      "ean_8",
      "upc_a",
      "upc_e",
      "qr_code",
      "data_matrix"
    ];

    const supported = await BarcodeDetector.getSupportedFormats();
    const formats = preferred.filter(f => supported.includes(f));

    barcodeDetector = new BarcodeDetector(
      formats.length ? { formats } : undefined
    );
  } catch (e) {
    barcodeDetector = null;
  }
})();


/* =========================
   OCR Workerを1回だけ作成
   毎回初期化しないので高速化
========================= */
function prepareOCR() {
  if (ocrReadyPromise) return ocrReadyPromise;

  ocrReadyPromise = (async () => {
    ocrWorker = await Tesseract.createWorker("eng");

    await ocrWorker.setParameters({
      tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-",
      preserve_interword_spaces: "0"
    });

    return ocrWorker;
  })();

  return ocrReadyPromise;
}


/* =========================
   カメラ起動
========================= */
cameraBtn.addEventListener("click", async () => {
  try {
    statusEl.textContent = "カメラ準備中…";

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    video.style.display = "block";
    scanFrame.style.display = "block";
    scanGuide.style.display = "block";

    cameraBtn.style.display = "none";
    stopBtn.style.display = "block";
    retryBtn.style.display = "none";

    completeOverlay.classList.remove("show");

    resetScanState();

    scanning = true;

    // OCR初期化は先に始めるが、バーコードは待たずに読める
    prepareOCR().catch(console.error);

    setTimeout(scanLoop, 250);

  } catch (error) {
    console.error(error);
    statusEl.textContent = "カメラを起動できません";
  }
});


/* =========================
   カメラ停止
========================= */
stopBtn.addEventListener("click", stopCamera);

function stopCamera() {
  scanning = false;

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
  video.style.display = "none";
  scanFrame.style.display = "none";
  scanGuide.style.display = "none";
  completeOverlay.classList.remove("show");

  cameraBtn.style.display = "block";
  stopBtn.style.display = "none";
  retryBtn.style.display = "none";

  statusEl.textContent = "停止中";
}


/* =========================
   再読み取り
========================= */
retryBtn.addEventListener("click", () => {
  if (!stream) return;

  completeOverlay.classList.remove("show");
  retryBtn.style.display = "none";

  resetScanState();

  scanning = true;
  setTimeout(scanLoop, 200);
});


function resetScanState() {
  previousValue = "";
  sameCount = 0;

  currentTextEl.textContent = "読み取り待ち";
  methodEl.textContent = "-";
  progressEl.textContent = "確認 0 / 2";
  statusEl.textContent = "🔍 読み取り中…";
}


/* =========================
   読取ループ
========================= */
async function scanLoop() {
  if (!scanning || scanBusy) return;

  if (video.readyState < 2) {
    setTimeout(scanLoop, 250);
    return;
  }

  scanBusy = true;

  try {
    statusEl.textContent = "🔍 読み取り中…";

    // 1. バーコードを最優先
    const barcodeResult = await tryBarcode();

    // 2. バーコードが無ければOCR
    if (!barcodeResult && scanning) {
      await tryOCR();
    }

  } catch (e) {
    console.error(e);
  } finally {
    scanBusy = false;

    if (scanning) {
      // OCR自体の処理時間もあるので、無駄な待ち時間を短めに
      setTimeout(scanLoop, 250);
    }
  }
}


/* =========================
   バーコード読取
========================= */
async function tryBarcode() {
  if (!barcodeDetector) return false;

  try {
    const barcodes = await barcodeDetector.detect(video);

    for (const barcode of barcodes) {
      const value = normalizeText(barcode.rawValue);

      if (!value) continue;

      currentTextEl.textContent = value;
      methodEl.textContent = "バーコード";

      if (value.includes(TARGET)) {
        handleDetected(TARGET, "バーコード");
        return true;
      }
    }

    return false;

  } catch (e) {
    return false;
  }
}


/* =========================
   OCR
========================= */
async function tryOCR() {
  const width = video.videoWidth;
  const height = video.videoHeight;

  if (!width || !height) return;

  const cropX = width * 0.09;
  const cropY = height * 0.34;
  const cropW = width * 0.82;
  const cropH = height * 0.28;

  // OCRに渡す画像を縮小して高速化
  const maxWidth = 900;
  const scale = Math.min(1, maxWidth / cropW);

  const outW = Math.max(1, Math.round(cropW * scale));
  const outH = Math.max(1, Math.round(cropH * scale));

  canvas.width = outW;
  canvas.height = outH;

  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  ctx.drawImage(
    video,
    cropX, cropY, cropW, cropH,
    0, 0, outW, outH
  );

  // 軽いコントラスト補正
  try {
    const imageData = ctx.getImageData(0, 0, outW, outH);
    const d = imageData.data;

    for (let i = 0; i < d.length; i += 4) {
      const gray = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
      const v = gray > 145 ? 255 : 0;
      d[i] = d[i + 1] = d[i + 2] = v;
    }

    ctx.putImageData(imageData, 0, 0);
  } catch (e) {}

  try {
    const worker = await prepareOCR();
    const result = await worker.recognize(canvas);

    const normalized = normalizeText(result.data.text || "");

    if (!normalized) return;

    currentTextEl.textContent = normalized;
    methodEl.textContent = "文字OCR";

    if (normalized.includes(TARGET)) {
      handleDetected(TARGET, "文字OCR");
    }

  } catch (e) {
    console.error("OCR error", e);
  }
}


/* =========================
   文字整形
========================= */
function normalizeText(text) {
  return String(text)
    .toUpperCase()
    .replace(/\s+/g, "")
    .replace(/[^A-Z0-9-]/g, "");
}


/* =========================
   2回一致判定
   読み取り方法が違っても
   同じ値なら2回として数える
========================= */
function handleDetected(value, method) {
  currentTextEl.textContent = value;
  methodEl.textContent = method;

  if (value === previousValue) {
    sameCount++;
  } else {
    previousValue = value;
    sameCount = 1;
  }

  progressEl.textContent = `確認 ${Math.min(sameCount, 2)} / 2`;
  statusEl.textContent = "認識確認中…";

  if (sameCount >= 2) {
    confirmData(value, method);
  }
}


/* =========================
   確定・端末保存
========================= */
function confirmData(value, method) {
  const now = new Date();

  confirmedData = {
    value,
    method,
    timeISO: now.toISOString(),
    timeText: now.toLocaleString("ja-JP")
  };

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(confirmedData)
  );

  showConfirmedData(confirmedData);

  statusEl.textContent = "✅ 読み取り完了";
  progressEl.textContent = "確認 2 / 2";

  // OCR/バーコードの連続解析だけ停止。
  // カメラ映像は表示したまま残す。
  scanning = false;

  overlayValue.textContent = value;
  completeOverlay.classList.add("show");

  retryBtn.style.display = "block";

  if (navigator.vibrate) {
    navigator.vibrate(120);
  }
}


/* =========================
   保持データ表示
========================= */
function showConfirmedData(data) {
  confirmedTextEl.textContent = data.value;
  confirmedMetaEl.textContent =
    `${data.method} / ${data.timeText}`;
}


/* =========================
   保存データ復元
========================= */
function restoreSavedData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);

    if (!raw) return;

    const data = JSON.parse(raw);

    if (!data || !data.value) return;

    confirmedData = data;
    showConfirmedData(data);

  } catch (e) {
    console.error(e);
  }
}


/* =========================
   他機能から保持データ取得用
========================= */
window.getConfirmedData = function() {
  return confirmedData;
};
</script>

</body>
</html>
